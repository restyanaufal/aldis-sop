<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOP Aldies</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sidebar-w: 280px;
      --toc-w: 220px;
      --accent: #e85d04;
      --accent-light: #fff3ec;
      --sidebar-bg: #111827;
      --sidebar-hover: #1f2937;
      --sidebar-active: #374151;
      --text: #111827;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --bg: #f9fafb;
      --content-bg: #ffffff;
      --topbar-bg: #ffffff;
      --radius: 8px;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-scale: 1rem;
    }
    [data-theme="dark"] {
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #374151;
      --bg: #0f172a;
      --content-bg: #1e293b;
      --topbar-bg: #1e293b;
      --accent-light: #431407;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
      transition: background 0.2s, color 0.2s;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      height: 100vh;
      flex-shrink: 0;
      overflow: hidden;
    }
    .sidebar-header { padding: 16px 16px 12px; border-bottom: 1px solid #1f2937; }
    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .logo-icon { width: 34px; height: 34px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
    .logo-text { color: #f9fafb; }
    .logo-text h1 { font-size: 14px; font-weight: 700; line-height: 1.2; }
    .logo-text span { font-size: 10px; color: #9ca3af; }

    .search-wrap { padding: 8px 12px 4px; }
    .search-wrap input {
      width: 100%; background: #1f2937; border: 1px solid #374151; border-radius: 6px;
      padding: 7px 10px; color: #d1d5db; font-size: 12.5px; outline: none;
    }
    .search-wrap input::placeholder { color: #6b7280; }
    .search-wrap input:focus { border-color: var(--accent); }

    /* Filter bar */
    .filter-bar { padding: 6px 12px 4px; display: flex; gap: 4px; flex-wrap: wrap; }
    .filter-btn {
      padding: 3px 8px; font-size: 10px; border-radius: 20px; border: 1px solid #374151;
      background: none; color: #6b7280; cursor: pointer; transition: all 0.15s; white-space: nowrap;
    }
    .filter-btn:hover { border-color: var(--accent); color: #f9fafb; }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

    .nav-scroll { flex: 1; overflow-y: auto; padding: 4px 0 4px; }
    .nav-scroll::-webkit-scrollbar { width: 4px; }
    .nav-scroll::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }

    .nav-index { display: block; padding: 7px 16px; color: #9ca3af; font-size: 12px; cursor: pointer; transition: color 0.15s; }
    .nav-index:hover { color: #f9fafb; }

    /* Recently Viewed */
    .recent-section { border-top: 1px solid #1f2937; padding: 8px 0 4px; }
    .recent-label { padding: 4px 16px; font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em; color: #4b5563; font-weight: 700; }
    .recent-item {
      display: flex; align-items: center; padding: 5px 16px 5px 28px; cursor: pointer;
      gap: 6px; transition: background 0.15s; border: none; background: none; width: 100%; text-align: left;
    }
    .recent-item:hover { background: var(--sidebar-hover); }
    .recent-item-name { font-size: 11.5px; color: #6b7280; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .recent-item:hover .recent-item-name { color: #d1d5db; }

    .nav-category { margin-top: 2px; }
    .cat-header { display: flex; align-items: center; padding: 7px 16px; cursor: pointer; user-select: none; }
    .cat-header:hover .cat-label { color: #f9fafb; }
    .cat-num { width: 20px; height: 20px; background: #374151; border-radius: 4px; font-size: 10px; font-weight: 700; color: #9ca3af; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-right: 8px; }
    .cat-label { font-size: 11px; font-weight: 600; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.05em; flex: 1; }
    .cat-toggle { color: #4b5563; font-size: 10px; transition: transform 0.2s; }
    .cat-toggle.open { transform: rotate(90deg); }
    .cat-files { display: none; }
    .cat-files.open { display: block; }

    .nav-item { display: flex; align-items: center; padding: 6px 16px 6px 40px; cursor: pointer; gap: 8px; transition: background 0.15s; border: none; background: none; width: 100%; text-align: left; }
    .nav-item:hover { background: var(--sidebar-hover); }
    .nav-item.active { background: var(--sidebar-active); }
    .nav-item.active .item-name { color: #f9fafb; }
    .nav-item.active .item-num { background: var(--accent); color: #fff; }
    .nav-item.hidden { display: none; }
    .item-num { width: 22px; height: 22px; background: #1f2937; border-radius: 5px; font-size: 10px; font-weight: 700; color: #6b7280; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .item-name { font-size: 12.5px; color: #9ca3af; line-height: 1.3; }

    /* ── MAIN ── */
    .main { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    .topbar {
      background: var(--topbar-bg);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      gap: 8px;
    }
    .topbar-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .topbar-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

    .back-btn {
      display: none; align-items: center; justify-content: center;
      width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--border);
      background: none; cursor: pointer; color: var(--text-muted); font-size: 16px;
      transition: all 0.15s;
    }
    .back-btn:hover { background: var(--bg); color: var(--text); }
    .back-btn.visible { display: flex; }

    .breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-muted); min-width: 0; }
    .breadcrumb span { color: var(--text); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .breadcrumb .sep { color: var(--border); flex-shrink: 0; }

    .status-badge { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }
    .badge-draft { background: #dbeafe; color: #1d4ed8; }
    .badge-review { background: #fef9c3; color: #a16207; }
    .badge-aktif { background: #dcfce7; color: #15803d; }
    .badge-notexist { background: #f3f4f6; color: #6b7280; }

    /* Topbar control buttons */
    .ctrl-btn {
      display: flex; align-items: center; justify-content: center;
      height: 30px; min-width: 30px; padding: 0 8px;
      border-radius: 6px; border: 1px solid var(--border);
      background: none; cursor: pointer; color: var(--text-muted);
      font-size: 12px; font-weight: 600; gap: 4px; transition: all 0.15s;
      white-space: nowrap;
    }
    .ctrl-btn:hover { background: var(--bg); color: var(--text); border-color: var(--text-muted); }
    .ctrl-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* Content wrapper with ToC */
    .content-wrapper { flex: 1; display: flex; overflow: hidden; }

    .content-scroll { flex: 1; overflow-y: auto; padding: 32px 28px 48px; }
    .content-scroll::-webkit-scrollbar { width: 6px; }
    .content-scroll::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }

    /* ── TOC PANEL ── */
    .toc-panel {
      width: var(--toc-w);
      flex-shrink: 0;
      overflow-y: auto;
      border-left: 1px solid var(--border);
      padding: 28px 0;
      display: none;
      background: var(--content-bg);
    }
    .toc-panel.visible { display: block; }
    .toc-panel::-webkit-scrollbar { width: 3px; }
    .toc-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .toc-header { padding: 0 16px 10px; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); }
    .toc-item {
      display: block; padding: 5px 16px; font-size: 12px; color: var(--text-muted);
      text-decoration: none; cursor: pointer; border-left: 2px solid transparent;
      margin-left: -1px; transition: all 0.15s; line-height: 1.4;
    }
    .toc-item:hover { color: var(--text); background: var(--bg); }
    .toc-item.active { color: var(--accent); border-left-color: var(--accent); font-weight: 600; }
    .toc-item.toc-h3 { padding-left: 28px; font-size: 11px; }

    /* ── WELCOME ── */
    .welcome { max-width: 620px; margin: 40px auto; text-align: center; }
    .welcome-icon { font-size: 52px; margin-bottom: 16px; }
    .welcome h2 { font-size: 24px; font-weight: 700; margin-bottom: 8px; color: var(--text); }
    .welcome p { color: var(--text-muted); font-size: 14px; line-height: 1.6; }
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 24px 0; }
    .stat-card { background: var(--content-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; text-align: center; }
    .stat-num { font-size: 28px; font-weight: 700; color: var(--accent); }
    .stat-label { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    /* ── META CARD ── */
    .meta-card { background: var(--accent-light); border: 1px solid #fbd38d; border-radius: var(--radius); padding: 14px 18px; margin-bottom: 24px; display: flex; flex-wrap: wrap; gap: 20px; }
    .meta-item { display: flex; flex-direction: column; gap: 2px; }
    .meta-key { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: #9a3412; font-weight: 600; }
    .meta-val { font-size: 13px; font-weight: 500; color: #7c2d12; }

    /* ── MARKDOWN CONTENT ── */
    .md-body { max-width: 820px; font-size: var(--font-scale); }

    .md-body h1 { font-size: calc(var(--font-scale) * 1.55); font-weight: 700; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px solid var(--accent); color: var(--text); }
    .md-body h2 { font-size: calc(var(--font-scale) * 1.13); font-weight: 700; margin: 28px 0 12px; color: var(--text); }
    .md-body h2::before { content: ''; display: inline-block; width: 4px; height: 16px; background: var(--accent); border-radius: 2px; margin-right: 8px; vertical-align: middle; }
    .md-body h3 { font-size: calc(var(--font-scale) * 1); font-weight: 600; margin: 20px 0 8px; color: #374151; }
    .md-body p { font-size: var(--font-scale); line-height: 1.7; color: #374151; margin-bottom: 12px; }
    .md-body hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
    .md-body strong { color: var(--text); }
    .md-body em { color: var(--text-muted); }
    .md-body code { background: #f3f4f6; border-radius: 4px; padding: 1px 6px; font-size: calc(var(--font-scale) * 0.9); font-family: 'SF Mono', 'Fira Code', monospace; color: #e85d04; }
    .md-body pre { background: #1c1c1e; border-radius: var(--radius); padding: 16px; overflow-x: auto; margin: 12px 0 16px; }
    .md-body pre code { background: none; color: #e5e7eb; font-size: 13px; padding: 0; }

    [data-theme="dark"] .md-body p,
    [data-theme="dark"] .md-body li,
    [data-theme="dark"] .md-body td { color: #d1d5db; }
    [data-theme="dark"] .md-body h3 { color: #e5e7eb; }
    [data-theme="dark"] .md-body code { background: #374151; color: #fb923c; }

    .md-body table { width: 100%; border-collapse: collapse; font-size: calc(var(--font-scale) * 0.93); margin: 12px 0 20px; border-radius: var(--radius); overflow: hidden; box-shadow: 0 0 0 1px var(--border); }
    .md-body th { background: #f3f4f6; font-size: calc(var(--font-scale) * 0.78); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding: 10px 14px; text-align: left; color: var(--text-muted); border-bottom: 1px solid var(--border); }
    .md-body td { padding: 9px 14px; border-bottom: 1px solid #f3f4f6; color: #374151; vertical-align: top; line-height: 1.5; }
    .md-body tr:last-child td { border-bottom: none; }
    .md-body tr:hover td { background: #fafafa; }
    [data-theme="dark"] .md-body th { background: #374151; }
    [data-theme="dark"] .md-body td { border-bottom-color: #374151; }
    [data-theme="dark"] .md-body tr:hover td { background: #334155; }

    .md-body ul { padding-left: 20px; margin-bottom: 12px; }
    .md-body li { font-size: var(--font-scale); line-height: 1.7; color: #374151; margin-bottom: 3px; }
    .md-body input[type="checkbox"] { accent-color: var(--accent); width: 15px; height: 15px; margin-right: 6px; vertical-align: middle; cursor: pointer; }
    .md-body li:has(input[type="checkbox"]) { list-style: none; margin-left: -20px; padding: 3px 0; }
    .md-body blockquote { border-left: 3px solid var(--accent); padding: 8px 16px; margin: 12px 0; background: var(--accent-light); border-radius: 0 var(--radius) var(--radius) 0; color: #92400e; font-size: calc(var(--font-scale) * 0.96); }

    /* Wiki links */
    .wiki-link { color: var(--accent); text-decoration: none; border-bottom: 1px dashed var(--accent); font-weight: 500; cursor: pointer; transition: background 0.15s; border-radius: 3px; padding: 0 2px; }
    .wiki-link:hover { background: var(--accent-light); border-bottom-style: solid; }
    .wiki-link-broken { color: #9ca3af; border-bottom: 1px dashed #d1d5db; cursor: not-allowed; border-radius: 3px; padding: 0 2px; }

    /* Loading */
    .loading { display: flex; align-items: center; justify-content: center; height: 200px; color: var(--text-muted); font-size: 14px; gap: 10px; }
    .spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Full-text search results */
    .search-results { padding: 4px 0 8px; border-top: 1px solid #1f2937; }
    .search-result-label { padding: 4px 16px; font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em; color: #4b5563; font-weight: 700; }
    .search-result-item { display: block; padding: 6px 16px 6px 28px; cursor: pointer; transition: background 0.15s; border: none; background: none; width: 100%; text-align: left; }
    .search-result-item:hover { background: var(--sidebar-hover); }
    .search-result-name { font-size: 12px; color: #9ca3af; display: block; }
    .search-result-item:hover .search-result-name { color: #f9fafb; }
    .search-result-snippet { font-size: 10.5px; color: #4b5563; display: block; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .search-highlight { background: #92400e; color: #fef3c7; border-radius: 2px; padding: 0 1px; }

    /* Mobile */
    .menu-toggle { display: none; background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 20px; padding: 4px; }
    @media (max-width: 768px) {
      .sidebar { position: fixed; left: -100%; z-index: 100; transition: left 0.25s; box-shadow: 4px 0 20px rgba(0,0,0,0.3); }
      .sidebar.open { left: 0; }
      .menu-toggle { display: block; }
      .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 99; }
      .overlay.open { display: block; }
      .content-scroll { padding: 20px 16px 40px; }
      .topbar { padding: 0 12px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .toc-panel { display: none !important; }
      .ctrl-btn span { display: none; }
    }

    /* ── PRINT FORM BUTTON ── */
    .h1-with-btn {
      display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap;
      margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px solid var(--accent);
    }
    .h1-with-btn h1 { flex: 1; border-bottom: none !important; margin-bottom: 0 !important; padding-bottom: 0 !important; }
    .print-form-btn {
      flex-shrink: 0; display: flex; align-items: center; gap: 5px;
      padding: 6px 12px; background: var(--accent); color: #fff;
      border: none; border-radius: 6px; font-size: 12px; font-weight: 600;
      cursor: pointer; white-space: nowrap; margin-top: 6px; transition: opacity 0.15s;
      font-family: var(--font);
    }
    .print-form-btn:hover { opacity: 0.82; }

    /* ── PRINT ── */
    @media print {
      .sidebar, .toc-panel, .overlay, .topbar { display: none !important; }
      body { overflow: auto; height: auto; display: block; }
      .main { height: auto; display: block; }
      .content-wrapper { display: block; overflow: visible; }
      .content-scroll { overflow: visible; padding: 0; }
      .md-body { max-width: 100%; }
      .meta-card { break-inside: avoid; }
      .md-body table { break-inside: avoid; }
      .md-body h2, .md-body h3 { break-after: avoid; }
      .print-form-btn { display: none !important; }

      /* Form-only print mode — hide everything except tagged form elements */
      body.print-form-only .meta-card { display: none !important; }
      body.print-form-only .md-body > p { display: none !important; }
      body.print-form-only .md-body > blockquote { display: none !important; }
      body.print-form-only .md-body > pre { display: none !important; }
      body.print-form-only .md-body > hr { display: none !important; }
      body.print-form-only .md-body h2:not([data-fh]) { display: none !important; }
      body.print-form-only .md-body h3:not([data-fh]) { display: none !important; }
      body.print-form-only .md-body > ul:not([data-form]) { display: none !important; }
      body.print-form-only .md-body table:not([data-form]) { display: none !important; }
      body.print-form-only .md-body table[data-form] { break-inside: auto; }
      body.print-form-only .md-body table[data-form] td { min-height: 26px; }
    }
  </style>
</head>
<body>

<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<!-- SIDEBAR -->
<nav class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="logo">
      <div class="logo-icon">🌭</div>
      <div class="logo-text">
        <h1>SOP Aldies</h1>
        <span>Standard Operating Procedure</span>
      </div>
    </div>
  </div>

  <div class="search-wrap">
    <input type="text" id="search" placeholder="🔍 Cari SOP atau konten..." oninput="handleSearch(this.value)">
  </div>

  <div class="filter-bar" id="filter-bar">
    <button class="filter-btn active" onclick="setFilter(this,'all')">Semua</button>
    <button class="filter-btn" onclick="setFilter(this,'Fase 1')">Fase 1</button>
    <button class="filter-btn" onclick="setFilter(this,'Fase 2')">Fase 2</button>
    <button class="filter-btn" onclick="setFilter(this,'Fase 3')">Fase 3</button>
    <button class="filter-btn" onclick="setFilter(this,'Induk')">Induk</button>
  </div>

  <div class="nav-scroll" id="nav-scroll">
    <a class="nav-index" onclick="loadIndex()">📋 Master Index</a>
    <div id="nav-tree"></div>
    <div id="search-results-panel" style="display:none"></div>
    <div class="recent-section" id="recent-section" style="display:none">
      <div class="recent-label">🕐 Terakhir Dibuka</div>
      <div id="recent-list"></div>
    </div>
  </div>
</nav>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <div class="topbar-left">
      <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
      <button class="back-btn" id="back-btn" onclick="goBack()" title="Kembali (Alt+←)">←</button>
      <div class="breadcrumb" id="breadcrumb"><span>SOP Aldies</span></div>
    </div>
    <div class="topbar-right">
      <span id="status-badge"></span>
      <button class="ctrl-btn" onclick="changeFontSize(-1)" title="Perkecil teks">A−</button>
      <button class="ctrl-btn" onclick="changeFontSize(1)" title="Perbesar teks">A+</button>
      <button class="ctrl-btn" id="dark-btn" onclick="toggleDark()" title="Dark mode">🌙</button>
      <button class="ctrl-btn" onclick="printDoc()" title="Print / Save PDF">🖨️ <span>Print</span></button>
    </div>
  </div>

  <div class="content-wrapper">
    <div class="content-scroll" id="content-scroll">
      <div id="content-area"></div>
    </div>
    <div class="toc-panel" id="toc-panel">
      <div class="toc-header">Daftar Isi</div>
      <div id="toc-list"></div>
    </div>
  </div>
</div>

<script>
// ── NAV DATA ──────────────────────────────────────────────────
const navData = [
  {
    id: "00", label: "SOP Induk", badge: "Formal",
    files: [
      { num: "F1", name: "Opening Outlet",       path: "00 - SOP Induk/SOP-OPS-01 - Opening Outlet.md",       priority: "Induk" },
      { num: "F2", name: "Closing Outlet",        path: "00 - SOP Induk/SOP-OPS-02 - Closing Outlet.md",        priority: "Induk" },
      { num: "F3", name: "Operasional Dapur",     path: "00 - SOP Induk/SOP-OPS-03 - Operasional Dapur.md",     priority: "Induk" },
      { num: "F4", name: "Pelayanan Pelanggan",   path: "00 - SOP Induk/SOP-OPS-04 - Pelayanan Pelanggan.md",   priority: "Induk" },
    ]
  },
  {

// ── WIKI LINK RESOLVER ───────────────────────────────────────
const linkMap = {};
navData.forEach(cat => {
  cat.files.forEach(f => {
    const filename = f.path.split('/').pop().replace('.md', '');
    [filename.toLowerCase(), f.name.toLowerCase()].forEach(k => {
      linkMap[k] = { path: f.path, name: f.name, cat: cat.label };
    });
    const bare = filename.replace(/^\d+ - /i, '').replace(/^SOP-[A-Z]+-\d+ - /i, '');
    if (bare) linkMap[bare.toLowerCase()] = { path: f.path, name: f.name, cat: cat.label };
  });
});

function resolveWikiLink(target) {
  const t = target.trim().toLowerCase();
  if (linkMap[t]) return linkMap[t];
  for (const [key, val] of Object.entries(linkMap)) {
    if (key.includes(t) || t.includes(key)) return val;
  }
  return null;
}

// ── BUILD NAV ────────────────────────────────────────────────
function buildNav() {
  const tree = document.getElementById('nav-tree');
  navData.forEach(cat => {
    const wrap = document.createElement('div');
    wrap.className = 'nav-category';
    wrap.dataset.cat = cat.id;

    const header = document.createElement('div');
    header.className = 'cat-header';
    header.innerHTML = `
      <div class="cat-num">${cat.id}</div>
      <div class="cat-label">${cat.label}${cat.badge ? ` <span style="font-size:9px;background:var(--accent);color:#fff;padding:1px 5px;border-radius:3px;margin-left:4px">${cat.badge}</span>` : ''}</div>
      <span class="cat-toggle open">›</span>`;
    header.onclick = () => toggleCat(wrap);

    const files = document.createElement('div');
    files.className = 'cat-files open';

    cat.files.forEach(f => {
      const btn = document.createElement('button');

  btn.classList.add('active');
  activeFilter = value;
  handleSearch(document.getElementById('search').value);
}

// ── SEARCH (name + full-text) ─────────────────────────────────
function handleSearch(q) {
  const query = q.toLowerCase().trim();
  const resultsPanel = document.getElementById('search-results-panel');
  const navTree = document.getElementById('nav-tree');

  // Filter sidebar nav items
  document.querySelectorAll('.nav-item').forEach(btn => {
    const nameMatch = !query || btn.dataset.name.includes(query);
    const filterMatch = activeFilter === 'all' || btn.dataset.priority === activeFilter;
    btn.classList.toggle('hidden', !(nameMatch && filterMatch));
  });
  document.querySelectorAll('.nav-category').forEach(cat => {
    const visible = [...cat.querySelectorAll('.nav-item')].some(b => !b.classList.contains('hidden'));
    cat.style.display = visible ? '' : 'none';
    if (query && visible) {
      cat.querySelector('.cat-files').classList.add('open');
      cat.querySelector('.cat-toggle').classList.add('open');
    }
  });

  // Full-text search results
  if (query.length >= 2 && Object.keys(contentIndex).length > 0) {
    const matches = [];
    Object.entries(contentIndex).forEach(([path, text]) => {
      const idx = text.toLowerCase().indexOf(query);
      if (idx !== -1) {
        const f = findFileByPath(path);
        if (!f) return;
        const filterOk = activeFilter === 'all' || f.priority === activeFilter;
        if (!filterOk) return;
        const snippet = text.slice(Math.max(0, idx - 30), idx + 60).replace(/\n/g, ' ');
        matches.push({ path, name: f.name, cat: f.catLabel, snippet, idx });
      }
    });
    if (matches.length > 0) {
      navTree.style.display = 'none';
      resultsPanel.style.display = 'block';
      resultsPanel.innerHTML = `
        <div class="search-results">
          <div class="search-result-label">🔍 ${matches.length} hasil dalam konten</div>
          ${matches.slice(0,8).map(m => `
            <button class="search-result-item" onclick="loadMd('${m.path.replace(/'/g,"\\'")}','${m.name.replace(/'/g,"\\'")}','${m.cat.replace(/'/g,"\\'")}');closeSidebar()">
              <span class="search-result-name">${m.name}</span>
              <span class="search-result-snippet">...${escHtml(m.snippet)}...</span>
            </button>`).join('')}
        </div>`;
      return;
    }
  }

  // Hide full-text results if not enough query or no matches
  navTree.style.display = '';
  resultsPanel.style.display = 'none';
}

function findFileByPath(path) {
  for (const cat of navData) {
    for (const f of cat.files) {
      if (f.path === path) return { ...f, catLabel: cat.label };
    }
  }
  return null;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── FRONTMATTER PARSER ───────────────────────────────────────
function parseFrontmatter(raw) {
  const match = raw.match(/^---\n([\s\S]*?)\n---/);
  if (!match) return { meta: {}, body: raw };
  const meta = {};
  match[1].split('\n').forEach(line => {
    const idx = line.indexOf(':');
    if (idx > 0) {
      meta[line.slice(0, idx).trim()] = line.slice(idx + 1).trim();
    }
  });
  return { meta, body: raw.slice(match[0].length).trim() };
}

// ── STATUS BADGE ─────────────────────────────────────────────
function statusBadge(status) {
  if (!status) return '';
  const s = status.toLowerCase();
  let cls = 'badge-notexist', label = status;
  if (s.includes('aktif'))  { cls = 'badge-aktif';  label = '✅ Aktif'; }
  if (s.includes('review')) { cls = 'badge-review'; label = '🔄 Review'; }
  if (s.includes('draft'))  { cls = 'badge-draft';  label = '📝 Draft'; }
  if (s.includes('not'))    { cls = 'badge-notexist'; label = '⬜ Not Exist'; }
  return `<span class="status-badge ${cls}">${label}</span>`;
}

// ── TABLE OF CONTENTS ─────────────────────────────────────────
function buildToC(contentEl) {
  const headings = [...contentEl.querySelectorAll('h2, h3')];
  const panel = document.getElementById('toc-panel');
  const list = document.getElementById('toc-list');

  if (headings.length < 3) { panel.classList.remove('visible'); return; }

  // Assign IDs to headings
  headings.forEach((h, i) => { if (!h.id) h.id = 'toc-' + i; });

  list.innerHTML = headings.map(h => {
    const cls = h.tagName === 'H3' ? 'toc-item toc-h3' : 'toc-item';
    return `<a class="${cls}" href="#${h.id}" onclick="tocClick(event,'${h.id}')">${escHtml(h.textContent)}</a>`;
  }).join('');

  panel.classList.add('visible');

  // Highlight active heading on scroll
  const scroll = document.getElementById('content-scroll');
  scroll.onscroll = () => {
    let active = headings[0];
    headings.forEach(h => { if (h.getBoundingClientRect().top < 120) active = h; });
    list.querySelectorAll('.toc-item').forEach(a => {
      a.classList.toggle('active', a.getAttribute('href') === '#' + (active && active.id));
    });
  };
}

function tocClick(e, id) {
  e.preventDefault();
  const el = document.getElementById(id);
  if (el) {
    document.getElementById('content-scroll').scrollTo({ top: el.offsetTop - 20, behavior: 'smooth' });
  }
}

  }
  currentPath = path;
  document.getElementById('back-btn').classList.toggle('visible', navHistory.length > 0);

function goBack() {
  const prev = navHistory.pop();
  if (!prev) return;
  const f = findFileByPath(prev);
  if (f) { currentPath = null; loadMd(prev, f.name, f.catLabel); }
  document.getElementById('back-btn').classList.toggle('visible', navHistory.length > 0);
}

// ── DETECT & INJECT FORM PRINT BUTTON ────────────────────────
function detectAndInjectFormBtn(area) {
  const mdBody = area.querySelector('.md-body');
  if (!mdBody) return;
  let hasForm = false;

  // Tag form tables: tables where ≥2 td cells are empty or contain only underscores/dashes
  mdBody.querySelectorAll('table').forEach(tbl => {
    const tds = [...tbl.querySelectorAll('td')];
    const emptyCount = tds.filter(td => {
      const t = td.textContent.trim();
      return !t || /^[_\-\s]*$/.test(t);
    }).length;
    if (emptyCount >= 2) {
      tbl.dataset.form = 'true';
      hasForm = true;
      tagPrecedingHeading(tbl);
    }
  });

  // Tag checklist sections
  mdBody.querySelectorAll('ul').forEach(ul => {
    if (ul.querySelector('input[type="checkbox"]')) {
      ul.dataset.form = 'true';
      hasForm = true;
      tagPrecedingHeading(ul);
    }
  });

  if (!hasForm) return;

  // Inject button next to H1
  const h1 = mdBody.querySelector('h1');
  if (!h1) return;
  const wrapper = document.createElement('div');
  wrapper.className = 'h1-with-btn';
  h1.parentNode.insertBefore(wrapper, h1);
  wrapper.appendChild(h1);
  const btn = document.createElement('button');
  btn.className = 'print-form-btn';
  btn.innerHTML = '🖨️ Cetak Form';
  btn.title = 'Print form & checklist saja (tanpa penjelasan)';
  btn.onclick = printForm;
  wrapper.appendChild(btn);
}

function tagPrecedingHeading(el) {
  let prev = el.previousElementSibling;
  while (prev) {
    const tag = prev.tagName;
    if (tag === 'H2' || tag === 'H3') { prev.dataset.fh = 'true'; return; }
    if (tag === 'TABLE' || tag === 'UL') return; // stop at another block
    prev = prev.previousElementSibling;
  }
}

// ── LOAD MD ──────────────────────────────────────────────────
async function loadMd(path, name, category) {
  pushHistory(path);
  setHash(path);
  addRecent(path, name, category);

  if (activeBtn) activeBtn.classList.remove('active');
  activeBtn = document.querySelector(`[data-path="${path}"]`);
  if (activeBtn) activeBtn.classList.add('active');

  document.getElementById('breadcrumb').innerHTML =
    `<span style="color:var(--text-muted);font-weight:400">${category}</span><span class="sep">›</span><span>${name}</span>`;

  const area = document.getElementById('content-area');
  area.innerHTML = `<div class="loading"><div class="spinner"></div> Memuat dokumen...</div>`;
  document.getElementById('status-badge').innerHTML = '';
  document.getElementById('toc-panel').classList.remove('visible');
  document.getElementById('content-scroll').scrollTop = 0;
  if (document.getElementById('content-scroll').onscroll)
    document.getElementById('content-scroll').onscroll = null;

  try {
    const encodedPath = path.split('/').map(s => encodeURIComponent(s)).join('/');
    const res = await fetch(encodedPath);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const raw = await res.text();
    contentIndex[path] = raw; // index for full-text search

    const { meta, body } = parseFrontmatter(raw);

    const cleanBody = body
      .replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (_, target, label) => {
        const displayText = label || target;
        const resolved = resolveWikiLink(target);
        if (resolved) {
          return `<a class="wiki-link" data-path="${resolved.path}" data-cat="${resolved.cat}" data-name="${resolved.name}" href="#">${displayText}</a>`;
        }
        return `<span class="wiki-link-broken" title="Dokumen tidak ditemukan: ${target}">${displayText}</span>`;
      })
      .replace(/^> \[!.*?\]\s*/gm, '> ');

    document.getElementById('status-badge').innerHTML = statusBadge(meta.status);
    area.innerHTML = `<div class="md-body">${metaCard(meta)}${marked.parse(cleanBody)}</div>`;

    // Wiki-link clicks
    area.querySelectorAll('a.wiki-link').forEach(link => {
      link.addEventListener('click', e => {
        e.preventDefault();
        loadMd(link.dataset.path, link.dataset.name, link.dataset.cat);
      });
    });

    // Checkboxes
    area.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.removeAttribute('disabled'));

    // Detect form elements and inject print button
    detectAndInjectFormBtn(area);

    // Table of Contents (after DOM mutations from detectAndInjectFormBtn)
    buildToC(area);

  } catch (err) {
    area.innerHTML = `
      <div style="text-align:center;padding:60px 20px;color:var(--text-muted)">
        <div style="font-size:40px;margin-bottom:12px">⚠️</div>
        <div style="font-size:15px;font-weight:600;margin-bottom:6px">Gagal memuat dokumen</div>
        <div style="font-size:13px">${err.message}</div>
        <div style="font-size:12px;margin-top:8px;opacity:0.6">Path: <code>${path}</code></div>
      </div>`;
  }
}

// ── LOAD INDEX ───────────────────────────────────────────────
function loadIndex() {
  navHistory = [];
  currentPath = null;
  if (activeBtn) activeBtn.classList.remove('active');
  activeBtn = null;
  history.replaceState(null, '', location.pathname);
  document.getElementById('breadcrumb').innerHTML = '<span>Master Index</span>';
  document.getElementById('status-badge').innerHTML = '';
  document.getElementById('toc-panel').classList.remove('visible');
  document.getElementById('back-btn').classList.remove('visible');
  document.getElementById('content-scroll').scrollTop = 0;

  const total = navData.reduce((sum, c) => sum + c.files.length, 0);
  const area = document.getElementById('content-area');
  area.innerHTML = `
    <div class="welcome">
      <div class="welcome-icon">🌭</div>
      <h2>SOP Aldies — Master Index</h2>
      <p>Standard Operating Procedure untuk seluruh outlet Aldies. Pilih dokumen dari sidebar atau klik kategori di bawah.</p>
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">Total Dokumen SOP</div></div>
        <div class="stat-card"><div class="stat-num">4</div><div class="stat-label">Outlet Aktif</div></div>
        <div class="stat-card"><div class="stat-num">7</div><div class="stat-label">Kategori</div></div>
      </div>
    </div>
    <div class="md-body" style="max-width:820px">
      ${navData.map(cat => `
        <h2>${cat.id} — ${cat.label}</h2>
        <table>
          <thead><tr><th>#</th><th>Dokumen</th><th>Prioritas</th></tr></thead>
          <tbody>
            ${cat.files.map(f => `
              <tr style="cursor:pointer" onclick="loadMd('${f.path.replace(/'/g,"\\'")}','${f.name.replace(/'/g,"\\'")}','${cat.label}')">
                <td><span class="item-num" style="display:inline-flex">${f.num}</span></td>
                <td style="color:var(--accent);font-weight:500">${f.name}</td>
                <td><span style="font-size:11px;background:#f3f4f6;padding:2px 8px;border-radius:20px;color:#6b7280">${f.priority}</span></td>
              </tr>`).join('')}
          </tbody>
        </table>`).join('')}
    </div>`;
}

// ── MOBILE ───────────────────────────────────────────────────
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}

// ── KEYBOARD SHORTCUTS ────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === '/' && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) {
    e.preventDefault();
    document.getElementById('search').focus();
  }
  if (e.altKey && e.key === 'ArrowLeft') goBack();
  if (e.key === 'Escape') document.getElementById('search').blur();
});

// ── BACKGROUND INDEXER ────────────────────────────────────────
async function backgroundIndex() {
  const allFiles = navData.flatMap(c => c.files);
  for (const f of allFiles) {
    if (contentIndex[f.path]) continue;
    try {
      await new Promise(r => setTimeout(r, 80)); // throttle
      const encoded = f.path.split('/').map(s => encodeURIComponent(s)).join('/');
      const res = await fetch(encoded);
      if (res.ok) contentIndex[f.path] = await res.text();
    } catch {}
  }
}

// ── INIT ─────────────────────────────────────────────────────
applyDark();
applyFontSize();
buildNav();
renderRecent();

// Hash routing on load
const hashPath = readHash();
if (hashPath) {
  const f = findFileByPath(hashPath);
  if (f) { loadMd(hashPath, f.name, f.catLabel); }
  else loadIndex();
} else {
  loadIndex();
}

// Start background indexer after 2s
setTimeout(backgroundIndex, 2000);
</script>
</body>
</html>
