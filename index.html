<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOP Aldies</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sidebar-w: 280px;
      --toc-w: 220px;
      --topnav-h: 48px;
      --accent: #e85d04;
      --accent-light: #fff3ec;
      --sidebar-bg: #111827;
      --sidebar-hover: #1f2937;
      --sidebar-active: #374151;
      --text: #111827;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --bg: #f9fafb;
      --content-bg: #ffffff;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-scale: 1rem;
    }
    [data-theme="dark"] {
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #374151;
      --bg: #0f172a;
      --content-bg: #1e293b;
      --accent-light: #431407;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      transition: background 0.2s, color 0.2s;
    }

    /* ── TOP NAV ── */
    .topnav {
      height: var(--topnav-h);
      background: #0f172a;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 8px;
      flex-shrink: 0;
      border-bottom: 1px solid #1e293b;
      z-index: 50;
    }
    .topnav-logo { display: flex; align-items: center; gap: 9px; margin-right: 8px; text-decoration: none; }
    .logo-icon { width: 30px; height: 30px; background: var(--accent); border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
    .logo-text { color: #f9fafb; font-size: 13px; font-weight: 700; white-space: nowrap; }
    .logo-sub { font-size: 10px; color: #6b7280; font-weight: 400; }

    .page-tabs { display: flex; gap: 2px; flex: 1; }
    .ptab {
      padding: 6px 14px; background: none; border: none; border-radius: 6px;
      font-size: 12.5px; font-weight: 500; color: #6b7280; cursor: pointer;
      transition: all 0.15s; white-space: nowrap; font-family: var(--font);
    }
    .ptab:hover { background: #1e293b; color: #d1d5db; }
    .ptab.active { background: var(--accent); color: #fff; font-weight: 700; }

    .topnav-right { display: flex; align-items: center; gap: 4px; margin-left: auto; }
    .topnav-btn {
      padding: 5px 9px; background: none; border: 1px solid #374151; border-radius: 6px;
      color: #9ca3af; cursor: pointer; font-size: 11.5px; font-weight: 600; font-family: var(--font);
      transition: all 0.15s; white-space: nowrap;
    }
    .topnav-btn:hover { border-color: #6b7280; color: #e5e7eb; }
    .topnav-btn.export-btn { border-color: #e85d04; color: #fb923c; }
    .topnav-btn.export-btn:hover { background: #e85d04; color: #fff; border-color: #e85d04; }

    /* ── APP BODY ── */
    .app-body {
      flex: 1;
      display: flex;
      overflow: hidden;
      height: calc(100vh - var(--topnav-h));
    }

    /* ── SIDEBAR ── */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      height: 100%;
      flex-shrink: 0;
      overflow: hidden;
      transition: width 0.2s;
    }
    body:not(.page-sop) .sidebar { display: none; }

    .search-wrap { padding: 10px 12px 4px; }
    .search-wrap input {
      width: 100%; background: #1f2937; border: 1px solid #374151; border-radius: 6px;
      padding: 7px 10px; color: #d1d5db; font-size: 12.5px; outline: none; font-family: var(--font);
    }
    .search-wrap input::placeholder { color: #6b7280; }
    .search-wrap input:focus { border-color: var(--accent); }

    .filter-bar { padding: 6px 12px 4px; display: flex; gap: 4px; flex-wrap: wrap; }
    .filter-btn { padding: 3px 8px; font-size: 10px; border-radius: 20px; border: 1px solid #374151; background: none; color: #6b7280; cursor: pointer; transition: all 0.15s; white-space: nowrap; font-family: var(--font); }
    .filter-btn:hover { border-color: var(--accent); color: #f9fafb; }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

    .nav-scroll { flex: 1; overflow-y: auto; padding: 4px 0; }
    .nav-scroll::-webkit-scrollbar { width: 4px; }
    .nav-scroll::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    .nav-index { display: block; padding: 7px 16px; color: #9ca3af; font-size: 12px; cursor: pointer; transition: color 0.15s; }
    .nav-index:hover { color: #f9fafb; }

    .recent-section { border-top: 1px solid #1f2937; padding: 8px 0 4px; }
    .recent-label { padding: 4px 16px; font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em; color: #4b5563; font-weight: 700; }
    .recent-item { display: flex; align-items: center; padding: 5px 16px 5px 28px; cursor: pointer; gap: 6px; transition: background 0.15s; border: none; background: none; width: 100%; text-align: left; font-family: var(--font); }
    .recent-item:hover { background: var(--sidebar-hover); }
    .recent-item-name { font-size: 11.5px; color: #6b7280; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .recent-item:hover .recent-item-name { color: #d1d5db; }

    .nav-category { margin-top: 2px; }
    .cat-header { display: flex; align-items: center; padding: 7px 16px; cursor: pointer; user-select: none; }
    .cat-header:hover .cat-label { color: #f9fafb; }
    .cat-num { width: 20px; height: 20px; background: #374151; border-radius: 4px; font-size: 10px; font-weight: 700; color: #9ca3af; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-right: 8px; }
    .cat-label { font-size: 11px; font-weight: 600; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.05em; flex: 1; }
    .cat-toggle { color: #4b5563; font-size: 10px; transition: transform 0.2s; }
    .cat-toggle.open { transform: rotate(90deg); }
    .cat-files { display: none; }
    .cat-files.open { display: block; }
    .nav-item { display: flex; align-items: center; padding: 6px 16px 6px 40px; cursor: pointer; gap: 8px; transition: background 0.15s; border: none; background: none; width: 100%; text-align: left; font-family: var(--font); }
    .nav-item:hover { background: var(--sidebar-hover); }
    .nav-item.active { background: var(--sidebar-active); }
    .nav-item.active .item-name { color: #f9fafb; }
    .nav-item.active .item-num { background: var(--accent); color: #fff; }
    .nav-item.hidden { display: none; }
    .item-num { width: 22px; height: 22px; background: #1f2937; border-radius: 5px; font-size: 10px; font-weight: 700; color: #6b7280; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .item-name { font-size: 12.5px; color: #9ca3af; line-height: 1.3; }

    .search-results { padding: 4px 0 8px; border-top: 1px solid #1f2937; }
    .search-result-label { padding: 4px 16px; font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em; color: #4b5563; font-weight: 700; }
    .search-result-item { display: block; padding: 6px 16px 6px 28px; cursor: pointer; transition: background 0.15s; border: none; background: none; width: 100%; text-align: left; font-family: var(--font); }
    .search-result-item:hover { background: var(--sidebar-hover); }
    .search-result-name { font-size: 12px; color: #9ca3af; display: block; }
    .search-result-item:hover .search-result-name { color: #f9fafb; }
    .search-result-snippet { font-size: 10.5px; color: #4b5563; display: block; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ── MAIN ── */
    .main { flex: 1; display: flex; flex-direction: column; height: 100%; overflow: hidden; }

    .topbar {
      background: var(--content-bg);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      gap: 8px;
    }
    body:not(.page-sop) .topbar { display: none; }
    .topbar-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .topbar-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

    .menu-toggle { background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 20px; padding: 4px; display: none; }
    @media (max-width: 768px) { .menu-toggle { display: block; } }

    .back-btn { display: none; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--border); background: none; cursor: pointer; color: var(--text-muted); font-size: 16px; transition: all 0.15s; }
    .back-btn:hover { background: var(--bg); color: var(--text); }
    .back-btn.visible { display: flex; }
    .breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-muted); min-width: 0; }
    .breadcrumb span { color: var(--text); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .breadcrumb .sep { color: var(--border); flex-shrink: 0; }
    .status-badge { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }
    .badge-draft { background: #dbeafe; color: #1d4ed8; }
    .badge-review { background: #fef9c3; color: #a16207; }
    .badge-aktif { background: #dcfce7; color: #15803d; }
    .badge-notexist { background: #f3f4f6; color: #6b7280; }
    .ctrl-btn { display: flex; align-items: center; justify-content: center; height: 30px; min-width: 30px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--border); background: none; cursor: pointer; color: var(--text-muted); font-size: 12px; font-weight: 600; gap: 4px; transition: all 0.15s; white-space: nowrap; font-family: var(--font); }
    .ctrl-btn:hover { background: var(--bg); color: var(--text); border-color: var(--text-muted); }

    /* ── CONTENT WRAPPER ── */
    .content-wrapper { flex: 1; display: flex; overflow: hidden; }
    .content-scroll { flex: 1; overflow-y: auto; padding: 32px 28px 48px; }
    .content-scroll::-webkit-scrollbar { width: 6px; }
    .content-scroll::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }

    body:not(.page-sop) .content-scroll { padding: 0; }

    .toc-panel { width: var(--toc-w); flex-shrink: 0; overflow-y: auto; border-left: 1px solid var(--border); padding: 28px 0; display: none; background: var(--content-bg); }
    .toc-panel.visible { display: block; }
    body:not(.page-sop) .toc-panel { display: none !important; }
    .toc-panel::-webkit-scrollbar { width: 3px; }
    .toc-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .toc-header { padding: 0 16px 10px; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); }
    .toc-item { display: block; padding: 5px 16px; font-size: 12px; color: var(--text-muted); text-decoration: none; cursor: pointer; border-left: 2px solid transparent; margin-left: -1px; transition: all 0.15s; line-height: 1.4; }
    .toc-item:hover { color: var(--text); background: var(--bg); }
    .toc-item.active { color: var(--accent); border-left-color: var(--accent); font-weight: 600; }
    .toc-item.toc-h3 { padding-left: 28px; font-size: 11px; }

    /* ── WELCOME / SOP INDEX ── */
    .welcome { max-width: 620px; margin: 40px auto; text-align: center; }
    .welcome-icon { font-size: 52px; margin-bottom: 16px; }
    .welcome h2 { font-size: 24px; font-weight: 700; margin-bottom: 8px; color: var(--text); }
    .welcome p { color: var(--text-muted); font-size: 14px; line-height: 1.6; }
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 24px 0; }
    .stat-card { background: var(--content-bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; text-align: center; }
    .stat-num { font-size: 28px; font-weight: 700; color: var(--accent); }
    .stat-label { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    /* ── MARKDOWN BODY ── */
    .meta-card { background: var(--accent-light); border: 1px solid #fbd38d; border-radius: 8px; padding: 14px 18px; margin-bottom: 24px; display: flex; flex-wrap: wrap; gap: 20px; }
    .meta-item { display: flex; flex-direction: column; gap: 2px; }
    .meta-key { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: #9a3412; font-weight: 600; }
    .meta-val { font-size: 13px; font-weight: 500; color: #7c2d12; }
    .md-body { max-width: 820px; font-size: var(--font-scale); }
    .md-body h1 { font-size: calc(var(--font-scale) * 1.55); font-weight: 700; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px solid var(--accent); color: var(--text); }
    .md-body h2 { font-size: calc(var(--font-scale) * 1.13); font-weight: 700; margin: 28px 0 12px; color: var(--text); }
    .md-body h2::before { content: ''; display: inline-block; width: 4px; height: 16px; background: var(--accent); border-radius: 2px; margin-right: 8px; vertical-align: middle; }
    .md-body h3 { font-size: calc(var(--font-scale) * 1); font-weight: 600; margin: 20px 0 8px; color: #374151; }
    .md-body p { font-size: var(--font-scale); line-height: 1.7; color: #374151; margin-bottom: 12px; }
    .md-body hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
    .md-body strong { color: var(--text); }
    .md-body code { background: #f3f4f6; border-radius: 4px; padding: 1px 6px; font-size: calc(var(--font-scale) * 0.9); font-family: 'SF Mono','Fira Code',monospace; color: #e85d04; }
    .md-body pre { background: #1c1c1e; border-radius: 8px; padding: 16px; overflow-x: auto; margin: 12px 0 16px; }
    .md-body pre code { background: none; color: #e5e7eb; font-size: 13px; padding: 0; }
    [data-theme="dark"] .md-body p, [data-theme="dark"] .md-body li, [data-theme="dark"] .md-body td { color: #d1d5db; }
    [data-theme="dark"] .md-body h3 { color: #e5e7eb; }
    [data-theme="dark"] .md-body code { background: #374151; color: #fb923c; }
    .md-body table { width: 100%; border-collapse: collapse; font-size: calc(var(--font-scale) * 0.93); margin: 12px 0 20px; border-radius: 8px; overflow: hidden; box-shadow: 0 0 0 1px var(--border); }
    .md-body th { background: #f3f4f6; font-size: calc(var(--font-scale) * 0.78); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding: 10px 14px; text-align: left; color: var(--text-muted); border-bottom: 1px solid var(--border); }
    .md-body td { padding: 9px 14px; border-bottom: 1px solid #f3f4f6; color: #374151; vertical-align: top; line-height: 1.5; }
    .md-body tr:last-child td { border-bottom: none; }
    .md-body tr:hover td { background: #fafafa; }
    [data-theme="dark"] .md-body th { background: #374151; }
    [data-theme="dark"] .md-body td { border-bottom-color: #374151; }
    [data-theme="dark"] .md-body tr:hover td { background: #334155; }
    .md-body ul { padding-left: 20px; margin-bottom: 12px; }
    .md-body li { font-size: var(--font-scale); line-height: 1.7; color: #374151; margin-bottom: 3px; }
    .md-body input[type="checkbox"] { accent-color: var(--accent); width: 15px; height: 15px; margin-right: 6px; vertical-align: middle; cursor: pointer; }
    .md-body li:has(input[type="checkbox"]) { list-style: none; margin-left: -20px; padding: 3px 0; }
    .md-body blockquote { border-left: 3px solid var(--accent); padding: 8px 16px; margin: 12px 0; background: var(--accent-light); border-radius: 0 8px 8px 0; color: #92400e; font-size: calc(var(--font-scale) * 0.96); }
    .wiki-link { color: var(--accent); text-decoration: none; border-bottom: 1px dashed var(--accent); font-weight: 500; cursor: pointer; transition: background 0.15s; border-radius: 3px; padding: 0 2px; }
    .wiki-link:hover { background: var(--accent-light); border-bottom-style: solid; }
    .wiki-link-broken { color: #9ca3af; border-bottom: 1px dashed #d1d5db; cursor: not-allowed; border-radius: 3px; padding: 0 2px; }
    .loading { display: flex; align-items: center; justify-content: center; height: 200px; color: var(--text-muted); font-size: 14px; gap: 10px; }
    .spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── PRINT FORM BUTTON ── */
    .h1-with-btn { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px solid var(--accent); }
    .h1-with-btn h1 { flex: 1; border-bottom: none !important; margin-bottom: 0 !important; padding-bottom: 0 !important; }
    .print-form-btn { flex-shrink: 0; display: flex; align-items: center; gap: 5px; padding: 6px 12px; background: var(--accent); color: #fff; border: none; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; margin-top: 6px; transition: opacity 0.15s; font-family: var(--font); }
    .print-form-btn:hover { opacity: 0.82; }
    .wa-copy-btn { flex-shrink: 0; display: flex; align-items: center; gap: 5px; padding: 6px 12px; background: #25d366; color: #fff; border: none; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; margin-top: 6px; transition: opacity 0.15s; font-family: var(--font); }
    .wa-copy-btn:hover { opacity: 0.82; }
    .wa-copy-btn.copied { background: #128c7e; }
    .toast-el { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); background: #1f2937; color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 13px; font-weight: 500; z-index: 9999; opacity: 0; transition: opacity 0.2s; pointer-events: none; white-space: nowrap; }
    .toast-el.show { opacity: 1; }
    /* WA templates */
    .wa-section { margin-bottom: 40px; }
    .wa-section h2 { font-size: 16px; font-weight: 700; margin-bottom: 4px; color: var(--text); }
    .wa-section .wa-sub { font-size: 12.5px; color: var(--text-muted); margin-bottom: 16px; }
    .wa-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
    .wa-card { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .wa-card-hd { background: #25d366; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .wa-card-hd span { font-size: 12.5px; font-weight: 700; color: #fff; }
    .wa-card-freq { font-size: 9.5px; background: rgba(255,255,255,0.2); color: #fff; border-radius: 4px; padding: 2px 7px; font-weight: 600; white-space: nowrap; flex-shrink: 0; }
    .wa-card-copy { background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.35); color: #fff; border-radius: 5px; padding: 4px 10px; font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap; flex-shrink: 0; font-family: var(--font); transition: background 0.15s; }
    .wa-card-copy:hover { background: rgba(255,255,255,0.32); }
    .wa-card-copy.copied { background: #128c7e; border-color: #0a6e60; }
    .wa-preview { padding: 12px 14px; background: var(--content-bg); font-size: 11px; color: var(--text-muted); font-family: monospace; line-height: 1.75; max-height: 220px; overflow-y: auto; white-space: pre; }
    .wa-bundle-card { grid-column: 1 / -1; }
    .wa-bundle-card .wa-card-hd { background: #075e54; }
    @media (max-width: 600px) { .wa-grid { grid-template-columns: 1fr; } }

    /* ── IMPLEMENTASI PAGE ── */
    .impl-page { max-width: 1000px; margin: 0 auto; padding: 36px 32px 64px; }
    .impl-hero { margin-bottom: 32px; }
    .impl-hero h1 { font-size: 26px; font-weight: 800; margin-bottom: 8px; color: var(--text); }
    .impl-hero p { font-size: 14px; color: var(--text-muted); line-height: 1.6; max-width: 600px; }
    .impl-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 36px; }
    .istat { background: var(--content-bg); border: 1px solid var(--border); border-radius: 10px; padding: 16px; text-align: center; }
    .istat-num { font-size: 26px; font-weight: 800; color: var(--accent); }
    .istat-label { font-size: 11px; color: var(--text-muted); margin-top: 3px; }

    /* Effort-Impact Matrix */
    .matrix-section { margin-bottom: 40px; }
    .matrix-section h2 { font-size: 16px; font-weight: 700; margin-bottom: 16px; color: var(--text); }
    .matrix-grid {
      display: grid;
      grid-template-columns: 80px repeat(3, 1fr);
      grid-template-rows: 32px repeat(3, 80px);
      gap: 4px;
      max-width: 640px;
    }
    .mx-header { display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .mx-row-label { display: flex; align-items: center; justify-content: flex-end; padding-right: 10px; font-size: 11px; font-weight: 700; color: var(--text-muted); text-align: right; text-transform: uppercase; letter-spacing: 0.04em; line-height: 1.3; }
    .mx-cell { border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-size: 11px; font-weight: 600; line-height: 1.4; padding: 8px; }
    .mx-skip  { background: #f1f5f9; color: #94a3b8; }
    .mx-later { background: #f0fdf4; color: #4ade80; }

    /* How to Start */

    /* Priority sections */

    .sop-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }

    .sop-card-p2 { border-left-color: #fb923c; }
    .sop-card-p3 { border-left-color: #d1d5db; }
    .sop-card-aktif { border-left-color: #22c55e; opacity: 0.8; }
    .sc-num { font-size: 10px; font-weight: 800; color: var(--accent); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.06em; }
    .sc-name { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 6px; line-height: 1.3; }
    .sc-tags { display: flex; gap: 4px; flex-wrap: wrap; }
    .sc-tag { font-size: 9.5px; padding: 2px 6px; border-radius: 4px; font-weight: 600; }
    .tag-effort-low  { background: #dcfce7; color: #15803d; }
    .tag-effort-med  { background: #fef9c3; color: #92400e; }
    .tag-effort-high { background: #fee2e2; color: #dc2626; }
    .tag-impact-high { background: #fce7f3; color: #be185d; }
    .tag-impact-med  { background: #ede9fe; color: #6d28d9; }
    .tag-freq        { background: #f3f4f6; color: #6b7280; }

    /* Freq table */
    .freq-section { margin-bottom: 36px; }
    .freq-section h2 { font-size: 16px; font-weight: 700; margin-bottom: 14px; color: var(--text); }
    .freq-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .freq-card { background: var(--content-bg); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .freq-card-header { padding: 10px 14px; font-size: 12px; font-weight: 700; }
    .fh-daily { background: #fff7ed; color: #c2410c; }
    .fh-weekly { background: #eff6ff; color: #1d4ed8; }
    .fh-other { background: #f0fdf4; color: #15803d; }
    .freq-card-body { padding: 10px 14px; }
    .freq-item { font-size: 11.5px; color: var(--text-muted); padding: 3px 0; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 6px; }
    .freq-item:last-child { border-bottom: none; }
    .freq-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

    /* ── TIMELINE ── */
    .tl-section { margin-bottom: 40px; }
    .tl-section > h2 { font-size: 16px; font-weight: 700; margin-bottom: 16px; color: var(--text); }
    .tl-week { border-radius: 12px; overflow: hidden; border: 1px solid var(--border); margin-bottom: 20px; }
    .tl-week-hd { padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; }
    .tl-day { padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--content-bg); }
    .tl-day:last-child { border-bottom: none; }
    .tl-day-hd { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
    .tl-day-label { font-size: 10.5px; font-weight: 800; background: var(--bg); border: 1px solid var(--border); padding: 3px 10px; border-radius: 20px; color: var(--text-muted); white-space: nowrap; }
    .tl-day-focus { font-size: 13px; font-weight: 700; color: var(--text); flex: 1; min-width: 0; }
    .tl-type-badge { font-size: 9.5px; font-weight: 700; padding: 3px 8px; border-radius: 4px; white-space: nowrap; flex-shrink: 0; }
    .tl-note { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; line-height: 1.6; padding: 8px 12px; background: var(--bg); border-radius: 6px; border-left: 3px solid var(--border); }
    .tl-note.special { border-left-color: #f59e0b; background: #fffbeb; color: #92400e; }
    .tl-note.special b { color: #78350f; }
    [data-theme="dark"] .tl-note.special { background: #41330044; color: #fbbf24; }
    .tl-sop-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 6px; }
    .tl-sop { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--content-bg); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; transition: all 0.15s; text-align: left; font-family: var(--font); width: 100%; }
    .tl-sop:hover { border-color: var(--accent); box-shadow: 0 1px 8px rgba(232,93,4,0.1); }
    .tl-score { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; flex-shrink: 0; }
    .ts11 { background: #e85d04; color: #fff; }
    .ts9  { background: #fb923c; color: #fff; }
    .ts8  { background: #fbbf24; color: #1f2937; }
    .ts7  { background: #e5e7eb; color: #6b7280; }
    .tl-sop-num  { font-size: 10px; font-weight: 800; color: var(--accent); white-space: nowrap; flex-shrink: 0; }
    .tl-sop-name { font-size: 12px; font-weight: 500; color: var(--text); flex: 1; line-height: 1.3; text-align: left; }
    .tl-sop-freq { font-size: 9.5px; color: var(--text-muted); white-space: nowrap; flex-shrink: 0; background: var(--bg); padding: 2px 6px; border-radius: 4px; }
    .tl-actions { display: flex; flex-direction: column; gap: 4px; }
    .tl-action { font-size: 12px; color: var(--text-muted); padding: 6px 10px; background: var(--bg); border-radius: 6px; display: flex; align-items: flex-start; gap: 8px; line-height: 1.4; }
    .tl-action::before { content: '→'; color: var(--accent); font-weight: 700; flex-shrink: 0; }

    /* Score table */
    .score-section { margin-bottom: 40px; }
    .score-section h2 { font-size: 16px; font-weight: 700; margin-bottom: 14px; color: var(--text); }
    .score-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--border); }
    .score-tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
    .score-tbl th { background: #f3f4f6; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--border); color: var(--text-muted); white-space: nowrap; }
    .score-tbl td { padding: 7px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .score-tbl tr:last-child td { border-bottom: none; }
    .score-tbl tr:hover td { background: var(--bg); }
    [data-theme="dark"] .score-tbl th { background: #374151; }
    .sf1 { background: #fff7ed; color: #c2410c; border: 1px solid #fed7aa; font-size:10px; padding:2px 7px; border-radius:20px; font-weight:700; white-space:nowrap; }
    .sf2 { background: #fffbeb; color: #b45309; border: 1px solid #fde68a; font-size:10px; padding:2px 7px; border-radius:20px; font-weight:700; white-space:nowrap; }
    .sf3 { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; font-size:10px; padding:2px 7px; border-radius:20px; font-weight:700; white-space:nowrap; }
    .sf4 { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; font-size:10px; padding:2px 7px; border-radius:20px; font-weight:700; white-space:nowrap; }
    .sf5 { background: #faf5ff; color: #6d28d9; border: 1px solid #ddd6fe; font-size:10px; padding:2px 7px; border-radius:20px; font-weight:700; white-space:nowrap; }
    .snum { font-size: 13px; font-weight: 800; }

    /* Roadmap after week 2 */
    .roadmap-section { margin-bottom: 40px; }
    .roadmap-section h2 { font-size: 16px; font-weight: 700; margin-bottom: 14px; color: var(--text); }
    .roadmap-row { display: flex; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
    .roadmap-col { flex: 1; padding: 14px 16px; border-right: 1px solid var(--border); background: var(--content-bg); }
    .roadmap-col:last-child { border-right: none; }
    .roadmap-period { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-muted); margin-bottom: 4px; }
    .roadmap-title { font-size: 12.5px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
    .roadmap-item { font-size: 11px; color: var(--text-muted); padding: 2px 0; display: flex; align-items: center; gap: 5px; }
    .roadmap-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--border); flex-shrink: 0; }
    @media (max-width: 768px) {

    .panduan-page { max-width: 820px; margin: 0 auto; padding: 36px 32px 64px; }
    .panduan-page h1 { font-size: 26px; font-weight: 800; margin-bottom: 8px; color: var(--text); }

    .panduan-section { margin-bottom: 36px; }
    .panduan-section h2 { font-size: 16px; font-weight: 700; margin-bottom: 14px; color: var(--text); display: flex; align-items: center; gap: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    .panduan-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
    .panduan-card { background: var(--content-bg); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
    .pc-icon { font-size: 22px; margin-bottom: 6px; }
    .pc-title { font-size: 12px; font-weight: 700; margin-bottom: 4px; color: var(--text); }
    .pc-desc { font-size: 11.5px; color: var(--text-muted); line-height: 1.5; }
    .status-row { display: flex; flex-direction: column; gap: 8px; }
    .status-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px; background: var(--content-bg); border: 1px solid var(--border); border-radius: 8px; }
    .status-item .status-badge { flex-shrink: 0; margin-top: 1px; }
    .status-item-desc { font-size: 12.5px; color: var(--text-muted); line-height: 1.5; }
    .fase-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
    .fase-card { border-radius: 8px; padding: 12px; }
    .f1 { background: #fff7ed; border: 1px solid #fed7aa; }
    .f2 { background: #fffbeb; border: 1px solid #fde68a; }
    .f3 { background: #f0fdf4; border: 1px solid #bbf7d0; }
    .f4 { background: #eff6ff; border: 1px solid #bfdbfe; }
    .f5 { background: #faf5ff; border: 1px solid #ddd6fe; }
    .fase-num { font-size: 11px; font-weight: 800; margin-bottom: 3px; }
    .fase-label { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
    .fase-desc { font-size: 11px; color: var(--text-muted); }
    .shortcut-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .shortcut-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--content-bg); border: 1px solid var(--border); border-radius: 6px; }
    .shortcut-key { background: #1f2937; color: #e5e7eb; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 4px; font-family: monospace; white-space: nowrap; }
    .shortcut-desc { font-size: 12px; color: var(--text-muted); }
    .quickref-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
    .qr-item { display: flex; gap: 10px; padding: 12px; background: var(--content-bg); border: 1px solid var(--border); border-radius: 8px; align-items: flex-start; }
    .qr-num { width: 22px; height: 22px; background: var(--accent); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; flex-shrink: 0; margin-top: 1px; }
    .qr-text { font-size: 12px; color: var(--text-muted); line-height: 1.5; }
    .qr-text strong { color: var(--text); display: block; margin-bottom: 2px; }

    /* ── MOBILE ── */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 99; }
    .overlay.open { display: block; }
    @media (max-width: 768px) {
      /* sidebar */
      .sidebar { position: fixed; left: -100%; top: var(--topnav-h); height: calc(100% - var(--topnav-h)); z-index: 100; transition: left 0.25s; box-shadow: 4px 0 20px rgba(0,0,0,0.3); }
      .sidebar.open { left: 0; }

      .ptab span { display: none; }
      /* grids */
      .stats-grid { grid-template-columns: repeat(2, 1fr); }

      .freq-grid { grid-template-columns: 1fr; }

      /* markdown tables: horizontal scroll instead of overflow */

      .wa-preview { white-space: pre-wrap; word-break: break-word; }
      /* timeline tweaks */
      .tl-week-hd { flex-wrap: wrap; gap: 8px; }
      .tl-day-hd { flex-wrap: wrap; }
      /* score table wrapper already has overflow-x auto */
      /* meta-card: tighter gap */
      .meta-card { gap: 12px; padding: 12px 14px; }
    }
    /* very small phones (≤480px) */
    @media (max-width: 480px) {
      /* hide logo text — keep just the 🌭 icon */

      /* tighter tab padding so all 3 fit */

    /* ── PRINT ── */
    @media print {
      .topnav, .sidebar, .toc-panel, .overlay, .topbar { display: none !important; }
      body { overflow: auto; height: auto; display: block; }

      .main { height: auto; display: block; }

      .md-body h2, .md-body h3 { break-after: avoid; }

      body.print-form-only .meta-card { display: none !important; }

      body.print-form-only .md-body > ul:not([data-form]) { display: none !important; }
      body.print-form-only .md-body table:not([data-form]) { display: none !important; }
    }
  </style>
</head>

// ── WIKI LINK RESOLVER ────────────────────────────────────────
const linkMap = {};
navData.forEach(cat => {
  cat.files.forEach(f => {
    const filename = f.path.split('/').pop().replace('.md', '');
    [filename.toLowerCase(), f.name.toLowerCase()].forEach(k => { linkMap[k] = { path: f.path, name: f.name, cat: cat.label }; });
    const bare = filename.replace(/^\d+ - /i, '').replace(/^SOP-[A-Z]+-\d+ - /i, '');
    if (bare) linkMap[bare.toLowerCase()] = { path: f.path, name: f.name, cat: cat.label };
  });
});
function resolveWikiLink(target) {
  const t = target.trim().toLowerCase();
  if (linkMap[t]) return linkMap[t];
  for (const [key, val] of Object.entries(linkMap)) { if (key.includes(t) || t.includes(key)) return val; }
  return null;
}

// ── PAGE NAVIGATION ───────────────────────────────────────────
function showPage(page) {
  closeSidebar();
  currentPage = page;
  document.body.className = `page-${page}`;
  document.querySelectorAll('.ptab').forEach(t => t.classList.remove('active'));
  document.getElementById(`ptab-${page}`).classList.add('active');
  document.getElementById('toc-panel').classList.remove('visible');
  document.getElementById('content-scroll').scrollTop = 0;

  if (page === 'implementasi') {
    history.replaceState(null, '', '#__impl');
    document.getElementById('content-area').innerHTML = renderImplementasi();
  } else if (page === 'panduan') {
    history.replaceState(null, '', '#__panduan');
    document.getElementById('content-area').innerHTML = renderPanduan();
  } else {
    loadIndex();
  }
}

function sopCardHtml(s) {
  const pClass = s.p === 1 ? 'sop-card-p1' : s.p === 2 ? 'sop-card-p2' : s.p === 0 ? 'sop-card-aktif' : 'sop-card-p3';
  const eTag   = s.effort === 'low' ? '<span class="sc-tag tag-effort-low">Low Effort</span>' : s.effort === 'med' ? '<span class="sc-tag tag-effort-med">Med Effort</span>' : s.effort === 'high' ? '<span class="sc-tag tag-effort-high">High Effort</span>' : '<span class="sc-tag tag-effort-low">✅ Aktif</span>';
  const iTag   = s.impact === 'high' ? '<span class="sc-tag tag-impact-high">High Impact</span>' : '<span class="sc-tag tag-impact-med">Med Impact</span>';
  return `<button class="sop-card ${pClass}" onclick="loadMd('${s.path.replace(/'/g,"\\'")}','${s.name.replace(/'/g,"\\'")}','${s.cat}');showPage('sop')">
    <div class="sc-num">#${s.num} · ${s.cat}</div>
    <div class="sc-name">${s.name}</div>
    <div class="sc-tags">${eTag}${iTag}<span class="sc-tag tag-freq">${s.freq}</span></div>
  </button>`;
}

// ── BUILD NAV ─────────────────────────────────────────────────
function buildNav() {
  const tree = document.getElementById('nav-tree');
  navData.forEach(cat => {
    const wrap = document.createElement('div');
    wrap.className = 'nav-category';
    wrap.dataset.cat = cat.id;
    const header = document.createElement('div');
    header.className = 'cat-header';
    header.innerHTML = `<div class="cat-num">${cat.id}</div><div class="cat-label">${cat.label}${cat.badge?` <span style="font-size:9px;background:var(--accent);color:#fff;padding:1px 5px;border-radius:3px;margin-left:4px">${cat.badge}</span>`:''}</div><span class="cat-toggle open">›</span>`;
    header.onclick = () => toggleCat(wrap);
    const files = document.createElement('div');
    files.className = 'cat-files open';
    cat.files.forEach(f => {
      const btn = document.createElement('button');
      btn.className = 'nav-item';
      btn.dataset.path = f.path;
      btn.dataset.name = f.name.toLowerCase();
      btn.dataset.priority = f.priority;
      btn.innerHTML = `<span class="item-num">${f.num}</span><span class="item-name">${f.name}</span>`;
      btn.onclick = () => { loadMd(f.path, f.name, cat.label); closeSidebar(); };
      files.appendChild(btn);
    });
    wrap.appendChild(header);
    wrap.appendChild(files);
    tree.appendChild(wrap);
  });
}
function toggleCat(wrap) {
  wrap.querySelector('.cat-files').classList.toggle('open');
  wrap.querySelector('.cat-toggle').classList.toggle('open');
}

// ── FILTER ────────────────────────────────────────────────────
function setFilter(btn, value) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeFilter = value;
  handleSearch(document.getElementById('search').value);
}

// ── SEARCH ────────────────────────────────────────────────────
function handleSearch(q) {
  const query = q.toLowerCase().trim();
  const resultsPanel = document.getElementById('search-results-panel');
  const navTree = document.getElementById('nav-tree');
  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.classList.toggle('hidden', !((!query || btn.dataset.name.includes(query)) && (activeFilter === 'all' || btn.dataset.priority === activeFilter)));
  });
  document.querySelectorAll('.nav-category').forEach(cat => {
    const visible = [...cat.querySelectorAll('.nav-item')].some(b => !b.classList.contains('hidden'));
    cat.style.display = visible ? '' : 'none';
    if (query && visible) { cat.querySelector('.cat-files').classList.add('open'); cat.querySelector('.cat-toggle').classList.add('open'); }
  });
  if (query.length >= 2 && Object.keys(contentIndex).length > 0) {
    const matches = [];
    Object.entries(contentIndex).forEach(([path, text]) => {
      const idx = text.toLowerCase().indexOf(query);
      if (idx !== -1) {
        const f = findFileByPath(path);
        if (!f || (activeFilter !== 'all' && f.priority !== activeFilter)) return;
        const snippet = text.slice(Math.max(0, idx - 30), idx + 60).replace(/\n/g, ' ');
        matches.push({ path, name: f.name, cat: f.catLabel, snippet });
      }
    });
    if (matches.length > 0) {
      navTree.style.display = 'none';
      resultsPanel.style.display = 'block';
      resultsPanel.innerHTML = `<div class="search-results"><div class="search-result-label">🔍 ${matches.length} hasil dalam konten</div>${matches.slice(0,8).map(m=>`<button class="search-result-item" onclick="loadMd('${m.path.replace(/'/g,"\\'")}','${m.name.replace(/'/g,"\\'")}','${m.cat.replace(/'/g,"\\'")}');closeSidebar()"><span class="search-result-name">${m.name}</span><span class="search-result-snippet">...${escHtml(m.snippet)}...</span></button>`).join('')}</div>`;
      return;
    }
  }
  navTree.style.display = '';
  resultsPanel.style.display = 'none';
}

function findFileByPath(path) {
  for (const cat of navData) { for (const f of cat.files) { if (f.path === path) return { ...f, catLabel: cat.label }; } }
  return null;
}
function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── RECENTLY VIEWED ───────────────────────────────────────────
function getRecent() { try { return JSON.parse(localStorage.getItem('sop-recent') || '[]'); } catch { return []; } }
function addRecent(path, name, cat) {
  let r = getRecent().filter(x => x.path !== path);
  r.unshift({ path, name, cat }); r = r.slice(0, 5);
  localStorage.setItem('sop-recent', JSON.stringify(r)); renderRecent();
}
function renderRecent() {
  const r = getRecent();
  const section = document.getElementById('recent-section');
  if (!r.length) { section.style.display = 'none'; return; }
  section.style.display = 'block';
  document.getElementById('recent-list').innerHTML = r.map(x => `<button class="recent-item" onclick="loadMd('${x.path.replace(/'/g,"\\'")}','${x.name.replace(/'/g,"\\'")}','${x.cat.replace(/'/g,"\\'")}');closeSidebar()"><span class="recent-item-name">↩ ${escHtml(x.name)}</span></button>`).join('');
}

// ── FRONTMATTER / META ────────────────────────────────────────
function parseFrontmatter(raw) {
  const match = raw.match(/^---\n([\s\S]*?)\n---/);
  if (!match) return { meta: {}, body: raw };
  const meta = {};
  match[1].split('\n').forEach(line => { const idx = line.indexOf(':'); if (idx > 0) meta[line.slice(0,idx).trim()] = line.slice(idx+1).trim(); });
  return { meta, body: raw.slice(match[0].length).trim() };
}
function statusBadge(status) {
  if (!status) return '';
  const s = status.toLowerCase();
  let cls = 'badge-notexist', label = status;
  if (s.includes('aktif'))  { cls = 'badge-aktif';  label = '✅ Aktif'; }
  if (s.includes('review')) { cls = 'badge-review'; label = '🔄 Review'; }
  if (s.includes('draft'))  { cls = 'badge-draft';  label = '📝 Draft'; }
  if (s.includes('not'))    { cls = 'badge-notexist'; label = '⬜ Not Exist'; }
  return `<span class="status-badge ${cls}">${label}</span>`;
}
function metaCard(meta) {
  const fields = [['PIC',meta.pic],['Frekuensi',meta.frekuensi],['Waktu',meta.waktu_pengerjaan],['Versi',meta.versi],['Update',meta.terakhir_diperbarui]].filter(([,v])=>v);
  if (!fields.length) return '';
  return `<div class="meta-card">${fields.map(([k,v])=>`<div class="meta-item"><span class="meta-key">${k}</span><span class="meta-val">${v}</span></div>`).join('')}</div>`;
}

// ── TABLE OF CONTENTS ─────────────────────────────────────────
function buildToC(contentEl) {
  const headings = [...contentEl.querySelectorAll('h2, h3')];
  const panel = document.getElementById('toc-panel');
  const list = document.getElementById('toc-list');
  if (headings.length < 3) { panel.classList.remove('visible'); return; }
  headings.forEach((h, i) => { if (!h.id) h.id = 'toc-' + i; });
  list.innerHTML = headings.map(h => `<a class="${h.tagName==='H3'?'toc-item toc-h3':'toc-item'}" href="#${h.id}" onclick="tocClick(event,'${h.id}')">${escHtml(h.textContent)}</a>`).join('');
  panel.classList.add('visible');
  const scroll = document.getElementById('content-scroll');
  scroll.onscroll = () => {
    let active = headings[0];
    headings.forEach(h => { if (h.getBoundingClientRect().top < 120) active = h; });
    list.querySelectorAll('.toc-item').forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + (active && active.id)));
  };
}
function tocClick(e, id) {
  e.preventDefault();
  const el = document.getElementById(id);
  if (el) document.getElementById('content-scroll').scrollTo({ top: el.offsetTop - 20, behavior: 'smooth' });
}

// ── HISTORY / HASH ────────────────────────────────────────────
function pushHistory(path) {
  if (currentPath && currentPath !== path) { navHistory.push(currentPath); if (navHistory.length > 30) navHistory.shift(); }
  currentPath = path;
  document.getElementById('back-btn').classList.toggle('visible', navHistory.length > 0);
}
function goBack() {
  const prev = navHistory.pop();
  if (!prev) return;
  const f = findFileByPath(prev);
  if (f) { currentPath = null; loadMd(prev, f.name, f.catLabel); }
  document.getElementById('back-btn').classList.toggle('visible', navHistory.length > 0);
}
function setHash(path) { history.replaceState(null, '', '#' + encodeURIComponent(path)); }
function readHash() { const h = location.hash.slice(1); if (!h) return null; try { return decodeURIComponent(h); } catch { return null; } }

// ── DARK MODE / FONT ──────────────────────────────────────────
function applyDark() {
  document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  document.getElementById('dark-btn').textContent = isDark ? '☀️' : '🌙';
}
function toggleDark() { isDark = !isDark; localStorage.setItem('sop-dark', isDark?'1':'0'); applyDark(); }
const fontSizes = ['0.875rem', '1rem', '1.0625rem', '1.125rem'];
function applyFontSize() { document.documentElement.style.setProperty('--font-scale', fontSizes[fontSizeLevel]); }
function changeFontSize(dir) { fontSizeLevel = Math.max(0, Math.min(3, fontSizeLevel + dir)); localStorage.setItem('sop-font', fontSizeLevel); applyFontSize(); }

// ── PRINT ─────────────────────────────────────────────────────
function printDoc() { window.print(); }
function printForm() {
  const mdBody = document.querySelector('.md-body');
  if (!mdBody) return;
  const sopName = mdBody.querySelector('h1')?.textContent?.trim() || 'Form SOP';
  const days = ['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'];
  const sections = [];
  mdBody.querySelectorAll('[data-form]').forEach(el => {
    let sectionTitle = '';
    let prev = el.previousElementSibling;
    while (prev) {
      if (['H2','H3'].includes(prev.tagName)) { sectionTitle = prev.textContent.trim(); break; }
      if (prev.dataset && prev.dataset.form) break;
      prev = prev.previousElementSibling;
    }
    if (el.tagName === 'UL' && el.querySelector('input[type="checkbox"]')) {
      const items = [...el.querySelectorAll('li')].map(li => (li.innerText||li.textContent).replace(/^\s*/,'').replace(/^[☐✓✅]\s*/,'').trim()).filter(Boolean);
      if (items.length) sections.push({ type: 'checklist', title: sectionTitle, items });
    } else if (el.tagName === 'TABLE') {
      sections.push({ type: 'table', title: sectionTitle, html: el.outerHTML });
    }
  });
  if (!sections.length) { window.print(); return; }
  let content = '';
  sections.forEach(sec => {
    if (sec.title) content += `<h2>${sec.title}</h2>`;
    if (sec.type === 'checklist') {
      content += `<table class="wk"><thead><tr><th class="col-item">Item Checklist</th>${days.map(d=>`<th class="col-day">${d}</th>`).join('')}</tr></thead><tbody>${sec.items.map((item,i)=>`<tr class="${i%2===1?'alt':''}"><td class="cell-item">${item}</td>${days.map(()=>'<td class="cell-chk"><div class="box"></div></td>').join('')}</tr>`).join('')}</tbody></table><div class="sig-row"><span>PIC: ________________________________</span><span>Tanda tangan: ________________________________</span></div>`;
    } else {
      content += `<div class="tbl-wrap">${sec.html}</div><p class="copy-note">* Fotokopi form ini × 7 untuk penggunaan harian selama seminggu</p>`;
    }
  });

// ── DETECT & INJECT FORM PRINT BUTTON ────────────────────────
function showToast(msg) {
  let t = document.getElementById('app-toast');
  if (!t) { t = document.createElement('div'); t.id = 'app-toast'; t.className = 'toast-el'; document.body.appendChild(t); }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.classList.remove('show'), 2500);
}

function generateWAText(area, name) {
  const lines = [];
  lines.push(`*${name.toUpperCase()}*`);
  lines.push(`\u{1F4C5} [Tanggal]   \u{1F3EA} [Nama Outlet]`);
  lines.push(`\u{1F465} [PIC / Store Leader]`);
  lines.push('━'.repeat(22));

  const nodes = area.querySelectorAll('h2, h3, li');
  let pendingSection = null;
  let sectionHasItems = false;
  nodes.forEach(el => {
    if (el.tagName === 'H2' || el.tagName === 'H3') {
      pendingSection = el.textContent.trim();
      sectionHasItems = false;
    } else if (el.tagName === 'LI') {
      const cb = el.querySelector('input[type="checkbox"]');
      if (cb) {
        if (pendingSection && !sectionHasItems) {
          lines.push('');
          lines.push(`*${pendingSection}*`);
          sectionHasItems = true;
          pendingSection = null;
        }
        lines.push(`□ ${el.textContent.trim()}`);
      }
    }
  });

  lines.push('');
  lines.push('━'.repeat(22));
  lines.push('✅ done   ❌ ada masalah → foto + lapor');
  return lines.join('\n');
}

function copyWAFormat() {
  const area = document.getElementById('content-area');
  const h1 = area.querySelector('h1');
  const name = h1 ? h1.textContent.trim() : 'SOP Checklist';
  const text = generateWAText(area, name);
  const btn = document.querySelector('.wa-copy-btn');
  navigator.clipboard.writeText(text).then(() => {
    showToast('✓ Format WA berhasil di-copy!');
    if (btn) { btn.textContent = '✓ Copied!'; btn.classList.add('copied'); setTimeout(() => { btn.innerHTML = '\u{1F4F1} Copy WA'; btn.classList.remove('copied'); }, 2000); }
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    showToast('✓ Format WA berhasil di-copy!');
    if (btn) { btn.textContent = '✓ Copied!'; setTimeout(() => { btn.innerHTML = '\u{1F4F1} Copy WA'; }, 2000); }
  });
}

function detectAndInjectFormBtn(area) {
  const mdBody = area.querySelector('.md-body');
  if (!mdBody) return;
  let hasForm = false;
  mdBody.querySelectorAll('table').forEach(tbl => {
    const tds = [...tbl.querySelectorAll('td')];
    if (tds.filter(td => { const t = td.textContent.trim(); return !t || /^[_\-\s]*$/.test(t); }).length >= 2) {
      tbl.dataset.form = 'true'; hasForm = true; tagPrecedingHeading(tbl);
    }
  });
  mdBody.querySelectorAll('ul').forEach(ul => {
    if (ul.querySelector('input[type="checkbox"]')) { ul.dataset.form = 'true'; hasForm = true; tagPrecedingHeading(ul); }
  });
  if (!hasForm) return;
  const h1 = mdBody.querySelector('h1');
  if (!h1) return;
  const wrapper = document.createElement('div');
  wrapper.className = 'h1-with-btn';
  h1.parentNode.insertBefore(wrapper, h1);
  wrapper.appendChild(h1);
  const btn = document.createElement('button');
  btn.className = 'print-form-btn';
  btn.innerHTML = '🖨️ Cetak Form';
  btn.title = 'Print form & checklist saja (tanpa penjelasan)';
  btn.onclick = printForm;
  wrapper.appendChild(btn);
  const waBtn = document.createElement('button');
  waBtn.className = 'wa-copy-btn';
  waBtn.innerHTML = '📱 Copy WA';
  waBtn.title = 'Copy format checklist untuk WhatsApp grup outlet';
  waBtn.onclick = copyWAFormat;
  wrapper.appendChild(waBtn);
}
function tagPrecedingHeading(el) {
  let prev = el.previousElementSibling;
  while (prev) {
    if (['H2','H3'].includes(prev.tagName)) { prev.dataset.fh = 'true'; return; }
    if (prev.tagName === 'TABLE' || prev.tagName === 'UL') return;
    prev = prev.previousElementSibling;
  }
}

// ── LOAD MD ───────────────────────────────────────────────────
async function loadMd(path, name, category) {
  document.body.className = 'page-sop';
  document.querySelectorAll('.ptab').forEach(t => t.classList.remove('active'));
  document.getElementById('ptab-sop').classList.add('active');
  pushHistory(path);
  setHash(path);
  addRecent(path, name, category);
  if (activeBtn) activeBtn.classList.remove('active');
  activeBtn = document.querySelector(`[data-path="${path}"]`);
  if (activeBtn) activeBtn.classList.add('active');
  document.getElementById('breadcrumb').innerHTML = `<span style="color:var(--text-muted);font-weight:400">${category}</span><span class="sep">›</span><span>${name}</span>`;
  const area = document.getElementById('content-area');
  area.innerHTML = `<div class="loading"><div class="spinner"></div> Memuat dokumen...</div>`;
  document.getElementById('status-badge').innerHTML = '';
  document.getElementById('toc-panel').classList.remove('visible');
  document.getElementById('content-scroll').scrollTop = 0;
  if (document.getElementById('content-scroll').onscroll) document.getElementById('content-scroll').onscroll = null;
  try {
    const encodedPath = path.split('/').map(s => encodeURIComponent(s)).join('/');
    const res = await fetch(encodedPath);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const raw = await res.text();
    contentIndex[path] = raw;
    const { meta, body } = parseFrontmatter(raw);
    const cleanBody = body
      .replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (_, target, label) => {
        const displayText = label || target;
        const resolved = resolveWikiLink(target);
        if (resolved) return `<a class="wiki-link" data-path="${resolved.path}" data-cat="${resolved.cat}" data-name="${resolved.name}" href="#">${displayText}</a>`;
        return `<span class="wiki-link-broken" title="Dokumen tidak ditemukan: ${target}">${displayText}</span>`;
      })
      .replace(/^> \[!.*?\]\s*/gm, '> ');
    document.getElementById('status-badge').innerHTML = statusBadge(meta.status);
    area.innerHTML = `<div class="md-body">${metaCard(meta)}${marked.parse(cleanBody)}</div>`;
    area.querySelectorAll('a.wiki-link').forEach(link => {
      link.addEventListener('click', e => { e.preventDefault(); loadMd(link.dataset.path, link.dataset.name, link.dataset.cat); });
    });
    area.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.removeAttribute('disabled'));
    detectAndInjectFormBtn(area);
    buildToC(area);
  } catch (err) {
    area.innerHTML = `<div style="text-align:center;padding:60px 20px;color:var(--text-muted)"><div style="font-size:40px;margin-bottom:12px">⚠️</div><div style="font-size:15px;font-weight:600;margin-bottom:6px">Gagal memuat dokumen</div><div style="font-size:13px">${err.message}</div><div style="font-size:12px;margin-top:8px;opacity:0.6">Path: <code>${path}</code></div></div>`;
  }
}

async function exportAllPDF() {
  // Must open window synchronously (user-gesture context) before any async
  const win = window.open('', '_blank');
  if (!win) { showToast('⚠️ Izinkan popup di browser untuk export PDF'); return; }

  const totalFiles = navData.reduce((s, c) => s + c.files.length, 0);

  win.document.write(`<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8">
  <title>Mempersiapkan PDF…</title>
  <style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,'Segoe UI',sans-serif;background:#0f172a;display:flex;align-items:center;justify-content:center;min-height:100vh;color:#f9fafb}.wrap{text-align:center;padding:40px}.icon{font-size:60px;margin-bottom:20px}.title{font-size:20px;font-weight:800;margin-bottom:8px}.sub{font-size:13px;color:#94a3b8;margin-bottom:24px}.track{width:300px;height:5px;background:#1e293b;border-radius:3px;margin:0 auto 10px;overflow:hidden}.bar{height:100%;background:#e85d04;border-radius:3px;width:0%;transition:width .25s ease}.status{font-size:12px;color:#64748b;min-height:18px}.pct{font-size:11px;color:#475569;margin-top:6px}</style>
  </head><body><div class="wrap">
    <div class="icon">🌭</div>
    <div class="title">Mempersiapkan PDF…</div>
    <div class="sub">Mengumpulkan ${totalFiles} dokumen SOP Aldies</div>
    <div class="track"><div class="bar" id="bar"></div></div>
    <div class="status" id="st">Memulai…</div>
    <div class="pct" id="pct">0 / ${totalFiles}</div>
  </div></body></html>`);
  win.document.close();

  let loaded = 0;
  for (const cat of navData) {
    for (const f of cat.files) {
      if (!contentIndex[f.path]) {
        try {
          const ep = f.path.split('/').map(s => encodeURIComponent(s)).join('/');
          const res = await fetch(ep);
          if (res.ok) contentIndex[f.path] = await res.text();
        } catch {}
      }
      loaded++;
      try {
        if (!win.closed) {
          const pct = Math.round((loaded / totalFiles) * 100);
          win.document.getElementById('bar').style.width = pct + '%';
          win.document.getElementById('st').textContent = f.name;
          win.document.getElementById('pct').textContent = loaded + ' / ' + totalFiles;

  win.document.open();
  win.document.write(html);

}

<html lang="id">
<head>

<title>SOP Aldies — Kompilasi Lengkap</title>
<style>${css}</style>
</head>
<body>
${body}
<script>window.onload=function(){setTimeout(function(){window.print();},700);}<\/script>

}

// ── BACKGROUND INDEXER ────────────────────────────────────────
async function backgroundIndex() {
  for (const cat of navData) {
    for (const f of cat.files) {
      if (contentIndex[f.path]) continue;
      try {
        await new Promise(r => setTimeout(r, 80));
        const res = await fetch(f.path.split('/').map(s => encodeURIComponent(s)).join('/'));
        if (res.ok) contentIndex[f.path] = await res.text();
      } catch {}
    }
  }
}

// ── INIT ──────────────────────────────────────────────────────
applyDark(); applyFontSize(); buildNav(); renderRecent();
const hashPath = readHash();
if (hashPath === '__impl') { showPage('implementasi'); }
else if (hashPath === '__panduan') { showPage('panduan'); }
else if (hashPath) { const f = findFileByPath(hashPath); if (f) loadMd(hashPath, f.name, f.catLabel); else loadIndex(); }
else { loadIndex(); }
setTimeout(backgroundIndex, 2000);
</script>
