<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOP Aldies</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sidebar-w: 280px;
      --accent: #e85d04;
      --accent-light: #fff3ec;
      --sidebar-bg: #111827;
      --sidebar-hover: #1f2937;
      --sidebar-active: #374151;
      --text: #111827;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --bg: #f9fafb;
      --content-bg: #ffffff;
      --radius: 8px;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      height: 100vh;
      flex-shrink: 0;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 20px 16px 16px;
      border-bottom: 1px solid #1f2937;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .logo-text { color: #f9fafb; }
    .logo-text h1 { font-size: 15px; font-weight: 700; line-height: 1.2; }
    .logo-text span { font-size: 11px; color: #9ca3af; }

    .search-wrap { padding: 10px 12px; }
    .search-wrap input {
      width: 100%;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 6px;
      padding: 7px 10px;
      color: #d1d5db;
      font-size: 13px;
      outline: none;
    }
    .search-wrap input::placeholder { color: #6b7280; }
    .search-wrap input:focus { border-color: var(--accent); }

    .nav-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0 16px;
    }
    .nav-scroll::-webkit-scrollbar { width: 4px; }
    .nav-scroll::-webkit-scrollbar-track { background: transparent; }
    .nav-scroll::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }

    .nav-index {
      display: block;
      padding: 8px 16px;
      color: #9ca3af;
      font-size: 12px;
      text-decoration: none;
      cursor: pointer;
      transition: color 0.15s;
    }
    .nav-index:hover { color: #f9fafb; }

    .nav-category { margin-top: 4px; }

    .cat-header {
      display: flex;
      align-items: center;
      padding: 8px 16px;
      cursor: pointer;
      user-select: none;
    }
    .cat-header:hover .cat-label { color: #f9fafb; }

    .cat-num {
      width: 20px;
      height: 20px;
      background: #374151;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      color: #9ca3af;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-right: 8px;
    }

    .cat-label {
      font-size: 11px;
      font-weight: 600;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      flex: 1;
    }

    .cat-toggle {
      color: #4b5563;
      font-size: 10px;
      transition: transform 0.2s;
    }
    .cat-toggle.open { transform: rotate(90deg); }

    .cat-files { display: none; }
    .cat-files.open { display: block; }

    .nav-item {
      display: flex;
      align-items: center;
      padding: 7px 16px 7px 40px;
      cursor: pointer;
      gap: 8px;
      transition: background 0.15s;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }
    .nav-item:hover { background: var(--sidebar-hover); }
    .nav-item.active { background: var(--sidebar-active); }
    .nav-item.active .item-name { color: #f9fafb; }
    .nav-item.active .item-num { background: var(--accent); color: #fff; }
    .nav-item.hidden { display: none; }

    .item-num {
      width: 22px;
      height: 22px;
      background: #1f2937;
      border-radius: 5px;
      font-size: 10px;
      font-weight: 700;
      color: #6b7280;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .item-name {
      font-size: 12.5px;
      color: #9ca3af;
      line-height: 1.3;
    }

    /* ── MAIN ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .topbar {
      background: var(--content-bg);
      border-bottom: 1px solid var(--border);
      padding: 0 28px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-muted);
    }
    .breadcrumb span { color: var(--text); font-weight: 500; }
    .breadcrumb .sep { color: #d1d5db; }

    .status-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .badge-draft { background: #dbeafe; color: #1d4ed8; }
    .badge-review { background: #fef9c3; color: #a16207; }
    .badge-aktif { background: #dcfce7; color: #15803d; }
    .badge-notexist { background: #f3f4f6; color: #6b7280; }

    .content-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 32px 28px 48px;
    }
    .content-scroll::-webkit-scrollbar { width: 6px; }
    .content-scroll::-webkit-scrollbar-track { background: transparent; }
    .content-scroll::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }

    /* ── WELCOME ── */
    .welcome {
      max-width: 620px;
      margin: 40px auto;
      text-align: center;
    }
    .welcome-icon { font-size: 52px; margin-bottom: 16px; }
    .welcome h2 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    .welcome p { color: var(--text-muted); font-size: 14px; line-height: 1.6; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 28px 0;
    }
    .stat-card {
      background: var(--content-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      text-align: center;
    }
    .stat-num { font-size: 28px; font-weight: 700; color: var(--accent); }
    .stat-label { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    /* ── META CARD ── */
    .meta-card {
      background: var(--accent-light);
      border: 1px solid #fbd38d;
      border-radius: var(--radius);
      padding: 14px 18px;
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }
    .meta-item { display: flex; flex-direction: column; gap: 2px; }
    .meta-key { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: #9a3412; font-weight: 600; }
    .meta-val { font-size: 13px; font-weight: 500; color: #7c2d12; }

    /* ── MARKDOWN CONTENT ── */
    .md-body { max-width: 820px; }

    .md-body h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--accent);
      color: var(--text);
    }
    .md-body h2 {
      font-size: 16px;
      font-weight: 700;
      margin: 28px 0 12px;
      color: var(--text);
    }
    .md-body h2::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 16px;
      background: var(--accent);
      border-radius: 2px;
      margin-right: 8px;
      vertical-align: middle;
    }
    .md-body h3 {
      font-size: 14px;
      font-weight: 600;
      margin: 20px 0 8px;
      color: #374151;
    }
    .md-body p { font-size: 14px; line-height: 1.7; color: #374151; margin-bottom: 12px; }
    .md-body hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
    .md-body strong { color: var(--text); }
    .md-body em { color: var(--text-muted); }
    .md-body code {
      background: #f3f4f6;
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 12.5px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      color: #e85d04;
    }
    .md-body pre {
      background: #1c1c1e;
      border-radius: var(--radius);
      padding: 16px;
      overflow-x: auto;
      margin: 12px 0 16px;
    }
    .md-body pre code {
      background: none;
      color: #e5e7eb;
      font-size: 13px;
      padding: 0;
    }

    /* Tables */
    .md-body table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin: 12px 0 20px;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 0 0 1px var(--border);
    }
    .md-body th {
      background: #f3f4f6;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 10px 14px;
      text-align: left;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
    }
    .md-body td {
      padding: 9px 14px;
      border-bottom: 1px solid #f3f4f6;
      color: #374151;
      vertical-align: top;
      line-height: 1.5;
    }
    .md-body tr:last-child td { border-bottom: none; }
    .md-body tr:hover td { background: #fafafa; }

    /* Lists */
    .md-body ul { padding-left: 20px; margin-bottom: 12px; }
    .md-body li { font-size: 14px; line-height: 1.7; color: #374151; margin-bottom: 3px; }

    /* Checkboxes */
    .md-body input[type="checkbox"] {
      accent-color: var(--accent);
      width: 15px;
      height: 15px;
      margin-right: 6px;
      vertical-align: middle;
      cursor: pointer;
    }
    .md-body li:has(input[type="checkbox"]) {
      list-style: none;
      margin-left: -20px;
      padding: 3px 0;
    }

    /* Blockquote */
    .md-body blockquote {
      border-left: 3px solid var(--accent);
      padding: 8px 16px;
      margin: 12px 0;
      background: var(--accent-light);
      border-radius: 0 var(--radius) var(--radius) 0;
      color: #92400e;
      font-size: 13.5px;
    }

    /* Wiki links */
    .wiki-link {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px dashed var(--accent);
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
      border-radius: 3px;
      padding: 0 2px;
    }
    .wiki-link:hover {
      background: var(--accent-light);
      border-bottom-style: solid;
    }
    .wiki-link-broken {
      color: #9ca3af;
      border-bottom: 1px dashed #d1d5db;
      cursor: not-allowed;
      border-radius: 3px;
      padding: 0 2px;
    }

    /* Loading */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 200px;
      color: var(--text-muted);
      font-size: 14px;
      gap: 10px;
    }
    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Mobile */
    .menu-toggle {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 20px;
      padding: 4px;
    }

    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        left: -100%;
        z-index: 100;
        transition: left 0.25s;
        box-shadow: 4px 0 20px rgba(0,0,0,0.3);
      }
      .sidebar.open { left: 0; }
      .menu-toggle { display: block; }
      .overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.4);
        z-index: 99;
      }
      .overlay.open { display: block; }
      .content-scroll { padding: 20px 16px 40px; }
      .topbar { padding: 0 16px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<!-- SIDEBAR -->
<nav class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="logo">
      <div class="logo-icon">🌭</div>
      <div class="logo-text">
        <h1>SOP Aldies</h1>
        <span>Standard Operating Procedure</span>
      </div>
    </div>
  </div>

  <div class="search-wrap">
    <input type="text" id="search" placeholder="Cari SOP..." oninput="filterNav(this.value)">
  </div>

  <div class="nav-scroll">
    <a class="nav-index" onclick="loadIndex()">📋 Master Index</a>

    <div id="nav-tree"></div>
  </div>
</nav>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:12px">
      <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
      <div class="breadcrumb" id="breadcrumb">
        <span>SOP Aldies</span>
      </div>
    </div>
    <div id="status-badge"></div>
  </div>

  <div class="content-scroll" id="content-scroll">
    <div id="content-area"></div>
  </div>
</div>

<script>
// ── NAV DATA ──────────────────────────────────────────────────
const navData = [
  {
    id: "00",
    label: "SOP Induk",
    badge: "Formal",
    files: [
      { num: "F1", name: "Opening Outlet",       path: "00 - SOP Induk/SOP-OPS-01 - Opening Outlet.md",       priority: "Induk" },
      { num: "F2", name: "Closing Outlet",        path: "00 - SOP Induk/SOP-OPS-02 - Closing Outlet.md",        priority: "Induk" },
      { num: "F3", name: "Operasional Dapur",     path: "00 - SOP Induk/SOP-OPS-03 - Operasional Dapur.md",     priority: "Induk" },
      { num: "F4", name: "Pelayanan Pelanggan",   path: "00 - SOP Induk/SOP-OPS-04 - Pelayanan Pelanggan.md",   priority: "Induk" },
    ]
  },
  {
    id: "01",
    label: "Operasional Toko",
    files: [
      { num: 8,  name: "Opening Checklist Report",   path: "01 - Operasional Toko/08 - Opening Checklist Report.md",   priority: "Fase 1" },
      { num: 7,  name: "Grooming Standardization",   path: "01 - Operasional Toko/07 - Grooming Standardization.md",   priority: "Fase 2" },
      { num: 6,  name: "Store Cleaning Checklist",   path: "01 - Operasional Toko/06 - Store Cleaning Checklist.md",   priority: "Fase 1" },
      { num: 9,  name: "Greeting Standard",          path: "01 - Operasional Toko/09 - Greeting Standard.md",          priority: "Fase 2" },
      { num: 10, name: "Closing Checklist Report",    path: "01 - Operasional Toko/10 - Closing Checklist Report.md",    priority: "Fase 1" },
      { num: 27, name: "Kesehatan & Higienitas",      path: "01 - Operasional Toko/27 - Kesehatan & Higienitas Karyawan.md", priority: "Fase 1" },
      { num: 28, name: "Training & Onboarding",       path: "01 - Operasional Toko/28 - Training & Onboarding Karyawan.md",  priority: "Fase 2" },
      { num: 29, name: "Emergency Response",          path: "01 - Operasional Toko/29 - Emergency Response.md",              priority: "Fase 1" },
    ]
  },
  {
    id: "02",
    label: "Dapur & Produk",
    files: [
      { num: 5,  name: "Food Safety Checklist",       path: "02 - Dapur & Produk/05 - Food Safety Checklist.md",       priority: "Fase 1" },
      { num: 13, name: "Standard Recipe Book",        path: "02 - Dapur & Produk/13 - Standard Recipe Book.md",        priority: "Fase 1" },
      { num: 14, name: "Cooking Time Standard",       path: "02 - Dapur & Produk/14 - Cooking Time Standard.md",       priority: "Fase 1" },
      { num: 15, name: "Plating Guide",               path: "02 - Dapur & Produk/15 - Plating Guide.md",               priority: "Fase 2" },
      { num: 16, name: "Quality Control Form",        path: "02 - Dapur & Produk/16 - Quality Control Form.md",        priority: "Fase 4" },
      { num: 17, name: "Menu Availability Checklist", path: "02 - Dapur & Produk/17 - Menu Availability Checklist.md", priority: "Fase 2" },
      { num: 21, name: "Waste Analysis Report",       path: "02 - Dapur & Produk/21 - Waste Analysis Report.md",       priority: "Fase 4" },
      { num: 22, name: "Next Day Preparation List",  path: "02 - Dapur & Produk/22 - Next Day Preparation List.md",   priority: "Fase 2" },
      { num: 26, name: "Kalibrasi & Pemeliharaan Alat", path: "02 - Dapur & Produk/26 - Kalibrasi & Pemeliharaan Alat.md", priority: "Fase 1" },
    ]
  },
  {
    id: "03",
    label: "Supply Chain",
    files: [
      { num: 3,  name: "Delivery Order",            path: "03 - Supply Chain/03 - Delivery Order.md",                   priority: "Fase 3" },
      { num: 4,  name: "FIFO Monitoring Sheet",     path: "03 - Supply Chain/04 - FIFO Monitoring Sheet.md",             priority: "Fase 3" },
      { num: 19, name: "Inventory Usage Report",    path: "03 - Supply Chain/19 - Inventory Usage Report.md",            priority: "Fase 3" },
      { num: 24, name: "Blok M × Ponpin Integration", path: "03 - Supply Chain/24 - Blok M Ponpin Integration SOP.md", priority: "Fase 1" },
    ]
  },
  {
    id: "04",
    label: "Penjualan & Pelanggan",
    files: [
      { num: 1,  name: "Customer Feedback Form",   path: "04 - Penjualan & Pelanggan/01 - Customer Feedback Form.md",   priority: "Fase 5" },
      { num: 2,  name: "Store Performance History", path: "04 - Penjualan & Pelanggan/02 - Store Performance History.md", priority: "Fase 5" },
      { num: 12, name: "Upselling Product",         path: "04 - Penjualan & Pelanggan/12 - Upselling Product.md",         priority: "Fase 2" },
      { num: 18, name: "Sales Summary Report",      path: "04 - Penjualan & Pelanggan/18 - Sales Summary Report.md",      priority: "Fase 4" },
      { num: 20, name: "Daily Sales Report",          path: "04 - Penjualan & Pelanggan/20 - Daily Sales Report.md",          priority: "Fase 4" },
      { num: 25, name: "Penanganan Komplain & Insiden", path: "04 - Penjualan & Pelanggan/25 - Penanganan Komplain & Insiden.md", priority: "Fase 1" },
    ]
  },
  {
    id: "05",
    label: "Keuangan",
    files: [
      { num: 23, name: "Petty Cash", path: "05 - Keuangan/23 - Petty Cash.md", priority: "Fase 4" },
    ]
  },
  {
    id: "06",
    label: "SDM & Disiplin",
    files: [
      { num: 30, name: "Rules Operasional & Code of Conduct", path: "06 - SDM & Disiplin/30 - Rules Operasional Store & Code of Conduct.md", priority: "Fase 1" },
    ]
  }
];

// ── WIKI LINK RESOLVER ───────────────────────────────────────
const linkMap = {};
navData.forEach(cat => {
  cat.files.forEach(f => {
    // Map by full filename (without .md)
    const filename = f.path.split('/').pop().replace('.md', '');
    linkMap[filename.toLowerCase()] = { path: f.path, name: f.name, cat: cat.label };
    // Map by display name
    linkMap[f.name.toLowerCase()] = { path: f.path, name: f.name, cat: cat.label };
    // Map by filename without leading number "XX - "
    const bare = filename.replace(/^\d+ - /i, '').replace(/^SOP-[A-Z]+-\d+ - /i, '');
    if (bare) linkMap[bare.toLowerCase()] = { path: f.path, name: f.name, cat: cat.label };
  });
});

function resolveWikiLink(target) {
  const t = target.trim().toLowerCase();
  if (linkMap[t]) return linkMap[t];
  // Fuzzy: find best partial match
  for (const [key, val] of Object.entries(linkMap)) {
    if (key.includes(t) || t.includes(key)) return val;
  }
  return null;
}

// ── BUILD NAV ────────────────────────────────────────────────
function buildNav() {
  const tree = document.getElementById('nav-tree');
  navData.forEach(cat => {
    const wrap = document.createElement('div');
    wrap.className = 'nav-category';
    wrap.dataset.cat = cat.id;

    const header = document.createElement('div');
    header.className = 'cat-header';
    header.innerHTML = `
      <div class="cat-num">${cat.id}</div>
      <div class="cat-label">${cat.label}</div>
      <div class="cat-toggle open">▶</div>
    `;
    header.onclick = () => toggleCat(wrap);

    const files = document.createElement('div');
    files.className = 'cat-files open';

    cat.files.forEach(f => {
      const btn = document.createElement('button');
      btn.className = 'nav-item';
      btn.dataset.path = f.path;
      btn.dataset.name = f.name.toLowerCase();
      btn.innerHTML = `<span class="item-num">${f.num}</span><span class="item-name">${f.name}</span>`;
      btn.onclick = () => { loadMd(f.path, f.name, cat.label); closeSidebar(); };
      files.appendChild(btn);
    });

    wrap.appendChild(header);
    wrap.appendChild(files);
    tree.appendChild(wrap);
  });
}

function toggleCat(wrap) {
  const files = wrap.querySelector('.cat-files');
  const toggle = wrap.querySelector('.cat-toggle');
  files.classList.toggle('open');
  toggle.classList.toggle('open');
}

// ── SEARCH ──────────────────────────────────────────────────
function filterNav(q) {
  const query = q.toLowerCase().trim();
  document.querySelectorAll('.nav-item').forEach(btn => {
    const name = btn.dataset.name || '';
    const match = !query || name.includes(query);
    btn.classList.toggle('hidden', !match);
  });
  document.querySelectorAll('.nav-category').forEach(cat => {
    const visible = [...cat.querySelectorAll('.nav-item')].some(b => !b.classList.contains('hidden'));
    cat.style.display = visible ? '' : 'none';
    if (query && visible) {
      cat.querySelector('.cat-files').classList.add('open');
      cat.querySelector('.cat-toggle').classList.add('open');
    }
  });
}

// ── FRONTMATTER PARSER ───────────────────────────────────────
function parseFrontmatter(raw) {
  const match = raw.match(/^---\n([\s\S]*?)\n---/);
  if (!match) return { meta: {}, body: raw };
  const meta = {};
  match[1].split('\n').forEach(line => {
    const idx = line.indexOf(':');
    if (idx > 0) {
      const k = line.slice(0, idx).trim();
      const v = line.slice(idx + 1).trim();
      meta[k] = v;
    }
  });
  return { meta, body: raw.slice(match[0].length).trim() };
}

// ── STATUS BADGE ─────────────────────────────────────────────
function statusBadge(status) {
  if (!status) return '';
  const s = status.toLowerCase();
  let cls = 'badge-notexist', label = status;
  if (s.includes('aktif'))   { cls = 'badge-aktif';  label = '✅ Aktif'; }
  if (s.includes('review'))  { cls = 'badge-review'; label = '🔄 Review'; }
  if (s.includes('draft'))   { cls = 'badge-draft';  label = '📝 Draft'; }
  if (s.includes('not'))     { cls = 'badge-notexist'; label = '⬜ Not Exist'; }
  return `<span class="status-badge ${cls}">${label}</span>`;
}

// ── META CARD ────────────────────────────────────────────────
function metaCard(meta) {
  const fields = [
    ['PIC', meta.pic],
    ['Frekuensi', meta.frekuensi],
    ['Waktu', meta.waktu_pengerjaan],
    ['Versi', meta.versi],
    ['Update', meta.terakhir_diperbarui],
  ].filter(([,v]) => v);
  if (!fields.length) return '';
  return `<div class="meta-card">${fields.map(([k,v]) =>
    `<div class="meta-item"><span class="meta-key">${k}</span><span class="meta-val">${v}</span></div>`
  ).join('')}</div>`;
}

// ── LOAD MD ──────────────────────────────────────────────────
let activeBtn = null;

async function loadMd(path, name, category) {
  // Update active nav item
  if (activeBtn) activeBtn.classList.remove('active');
  activeBtn = document.querySelector(`[data-path="${path}"]`);
  if (activeBtn) activeBtn.classList.add('active');

  // Update breadcrumb
  document.getElementById('breadcrumb').innerHTML =
    `<span>${category}</span><span class="sep">›</span><span>${name}</span>`;

  // Show loading
  const area = document.getElementById('content-area');
  area.innerHTML = `<div class="loading"><div class="spinner"></div> Memuat dokumen...</div>`;
  document.getElementById('status-badge').innerHTML = '';
  document.getElementById('content-scroll').scrollTop = 0;

  try {
    // Encode each path segment to handle spaces
    const encodedPath = path.split('/').map(s => encodeURIComponent(s)).join('/');
    const res = await fetch(encodedPath);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const raw = await res.text();
    const { meta, body } = parseFrontmatter(raw);

    // Convert Obsidian wiki-links [[...]] to clickable links
    const cleanBody = body
      .replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (_, target, label) => {
        const displayText = label || target;
        const resolved = resolveWikiLink(target);
        if (resolved) {
          return `<a class="wiki-link" data-path="${resolved.path}" data-cat="${resolved.cat}" data-name="${resolved.name}" href="#">${displayText}</a>`;
        }
        return `<span class="wiki-link-broken" title="Dokumen tidak ditemukan: ${target}">${displayText}</span>`;
      })
      .replace(/^> \[!.*?\]\s*/gm, '> ');

    // Render
    document.getElementById('status-badge').innerHTML = statusBadge(meta.status);
    area.innerHTML = `
      <div class="md-body">
        ${metaCard(meta)}
        ${marked.parse(cleanBody)}
      </div>
    `;

    // Wire up wiki-link clicks
    area.querySelectorAll('a.wiki-link').forEach(link => {
      link.addEventListener('click', e => {
        e.preventDefault();
        loadMd(link.dataset.path, link.dataset.name, link.dataset.cat);
        document.getElementById('content-scroll').scrollTop = 0;
        closeSidebar();
      });
    });

    // Make checkboxes functional (toggle UI only, not persistent)
    area.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      cb.removeAttribute('disabled');
    });

  } catch (err) {
    area.innerHTML = `
      <div style="text-align:center;padding:60px 20px;color:#6b7280">
        <div style="font-size:40px;margin-bottom:12px">⚠️</div>
        <div style="font-size:15px;font-weight:600;margin-bottom:6px">Gagal memuat dokumen</div>
        <div style="font-size:13px">${err.message}</div>
        <div style="font-size:12px;margin-top:8px;color:#9ca3af">Pastikan file MD tersedia di path: <code>${path}</code></div>
      </div>`;
  }
}

// ── MOBILE ───────────────────────────────────────────────────
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}

// ── INIT ─────────────────────────────────────────────────────
buildNav();
loadIndex();
